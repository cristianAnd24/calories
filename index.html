/* ==========================================================================
   AI logging. A Supabase Edge Function (cal-ai) holds the AI key (Gemini or
   Claude) and counts each person's use; this page never sees a key. The model
   only ever gets text or a photo, and nothing it says is saved until it is
   checked.
   ========================================================================== */
const AI_URL=SB_URL+"/functions/v1/cal-ai";
/* "unknown" until a status reply or an error says otherwise. aiAt is when a
   reply last said "on" or "off": an "off" older than AI_RECHECK is asked
   again, since the owner may have added the key since. aiProv is the
   provider the last reply named ("gemini", "claude" or ""): status always
   names it, and so does every task reply once the server has chosen one.
   Like the rest of this, it lasts for the session and is never stored. */
let aiState="unknown",aiProv="",aiUse=null,aiLast=null,aiStatusP=null,aiChecked=false,aiAt=0;
const AI_RECHECK=5*60000;
const aiWatch=new Set();
const AI_PROV_NAME={gemini:"Gemini",claude:"Claude"};
/* The server counts by its own date, which is UTC. */
const utcDay=()=>new Date().toISOString().slice(0,10);
function aiSet(state,use,prov){
  if(state){aiState=state;aiAt=Date.now()}
  if(use)aiUse={used:use.used,limit:use.limit,day:utcDay()};
  /* A server from before providers sends none: what is known stays. */
  if(typeof prov==="string")aiProv=prov==="gemini"||prov==="claude"?prov:"";
  aiWatch.forEach(f=>{try{f()}catch(e){}});
}
/* On Gemini's free tier Google may use what is sent, so the sheets that send
   something say so while the server says it is Gemini. It follows the status
   check a sheet may still be waiting on; stop() when the sheet closes. */
function aiProvNote(cls="foot"){
  const p=el("p",cls,"Uses Google Gemini. On Gemini’s free tier, Google may review what you send and use it to improve its products.");
  const sync=()=>p.classList.toggle("hidden",aiProv!=="gemini");
  sync();aiWatch.add(sync);
  return {el:p,stop:()=>aiWatch.delete(sync)};
}
const aiErr=(code,x)=>Object.assign(new Error(code),{code},x||{});
const aiCount=j=>j&&typeof j.used==="number"&&j.used>=0&&j.limit>0?{used:j.used,limit:j.limit}:null;
/* A reply, read: the JSON, or an Error whose .code says why not. Only a 404
   means nothing is there. A page that is not JSON is a gateway in trouble
   (502, 504) or a Wi-Fi login page, so it reads as busy, which passes;
   another 4xx page is not the function either. */
function aiRead(r,txt){
  let j;try{j=JSON.parse(txt)}catch(e){j=null}
  if(r.status===404)throw aiErr("not_deployed");
  if(!j||typeof j!=="object")throw aiErr(r.ok||r.status>=500?"busy":"not_deployed");
  if(!r.ok||j.error)throw aiErr(typeof j.error==="string"?j.error:r.status>=500?"busy":"not_deployed",
    {limit:j.limit,use:aiCount(j),reason:j.reason,prov:j.provider});
  return j;
}
/* Resolves with the reply, or throws an Error whose .code is the server's
   error, not_deployed, offline, timeout, or cancelled (signal aborted). */
async function aiCall(task,payload,{ms=36000,signal}={}){
  let j;
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),ms);
  const stop=()=>ctl.abort();
  if(signal){if(signal.aborted)stop();else signal.addEventListener("abort",stop)}
  const why=()=>signal&&signal.aborted?"cancelled":"timeout";
  try{
    if(navigator.onLine===false)throw aiErr("offline");
    let r,txt;
    try{
      r=await fetch(AI_URL,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},
        body:JSON.stringify(Object.assign({key:S.key,task},payload)),signal:ctl.signal});
      txt=await r.text();
    }catch(e){
      if(ctl.signal.aborted)throw aiErr(why());
      /* These headers make the browser ask the server first (a preflight).
         Where no function is deployed the gateway refuses that, and the
         browser reports it exactly like no connection. A plain request needs
         no asking, so any reply to one means the server is there: it asks
         for status, which is free, and is read like any other reply. */
      let pr,ptxt;
      try{
        pr=await fetch(AI_URL,{method:"POST",body:JSON.stringify({key:S.key,task:"status"}),signal:ctl.signal});
        ptxt=await pr.text();
      }catch(e2){throw aiErr(ctl.signal.aborted?why():"offline")}
      const pj=aiRead(pr,ptxt);
      if(task!=="status"){
        /* The function answers, so the request itself was lost on the way. */
        aiSet(pj.configured===false?"off":"on",aiCount(pj),pj.provider);
        throw aiErr(pj.configured===false?"not_configured":"busy",{use:aiCount(pj)});
      }
      r=pr;txt=ptxt;
    }
    j=aiRead(r,txt);
  }catch(e){
    /* Stopped by the person: nothing was learned. */
    if(e.code==="cancelled")throw e;
    aiLast=e.code||"busy";
    /* No key, or no function: no provider either. A rejected key keeps its
       name. A reply that names the provider (any once the AI is chosen) says
       where requests go, even if no status check has answered. */
    if(/^(not_configured|not_deployed)$/.test(aiLast))aiSet("off",null,"");
    else if(aiLast==="bad_key")aiSet("off",null,e.prov);
    else if(/^(daily|group)_limit$/.test(aiLast))aiSet("on",e.use||(aiLast==="daily_limit"&&e.limit>0?{used:e.limit,limit:e.limit}:null),e.prov);
    else aiSet(null,e.use,e.prov);
    /* The server counts a request that got as far as the AI, answered or
       not. When the reply did not say the new count, ask for it, so the
       count shown is the server's. Not after bad_key: status would call a
       rejected key "configured" and turn AI back on. */
    if(task!=="status"&&!e.use&&!/^(offline|not_configured|not_deployed|bad_key|unknown_key|bad_request|daily_limit|group_limit)$/.test(aiLast))
      setTimeout(aiStatus,0);
    throw e;
  }finally{clearTimeout(timer);if(signal)signal.removeEventListener("abort",stop)}
  aiLast=null;
  if(task==="status")aiSet(j.configured?"on":"off",{used:Math.max(0,+j.used||0),limit:+j.limit||60},j.configured?j.provider:"");
  else{
    aiSet("on",aiCount(j)||(aiUse?{used:aiUse.used+1,limit:aiUse.limit}:null),j.provider);
    /* It worked, yet nothing has said which AI it was (a status check that
       timed out, a server from before task replies named it): ask, so the
       Gemini note shows from the next sheet on. Status is free. */
    if(!aiProv)setTimeout(aiStatus,0);
  }
  return j;
}
/* One status check at a time. It never counts towards the limit. */
function aiStatus(){
  if(!S.key)return Promise.resolve(null);
  if(!aiStatusP){aiStatusP=aiCall("status",{},{ms:10000}).catch(()=>null).then(j=>{aiStatusP=null;aiSet();return j});aiSet()}
  return aiStatusP;
}
/* Worth asking again: still unknown, or an "off" or a used-up day that is
   a few minutes old. */
const aiSpent=()=>aiState==="on"&&!!aiUse&&aiUse.limit>0&&aiUse.used>=aiUse.limit&&aiUse.day===utcDay();
const aiStale=()=>aiState==="unknown"||((aiState==="off"||aiSpent())&&Date.now()-aiAt>AI_RECHECK);
/* Gemini's free daily allowance comes back at midnight Pacific time. Said in
   this phone's own time ("3:00 a.m." in Toronto, "1:00 a.m." in Calgary), since
   the group is spread across time zones. */
function aiQuotaBack(){
  try{
    const now=new Date(),p={};
    new Intl.DateTimeFormat("en-US",{timeZone:"America/Los_Angeles",hourCycle:"h23",hour:"2-digit",minute:"2-digit",second:"2-digit"})
      .formatToParts(now).forEach(x=>{p[x.type]=+x.value});
    const back=new Date(now.getTime()-(((p.hour%24)*60+p.minute)*60+p.second)*1000-now.getMilliseconds()+864e5);
    if(isNaN(back))throw 0;
    if(!back.getHours()&&!back.getMinutes())return "It comes back at midnight.";
    /* "3:00 a.m." on a 12-hour phone, "03:00" on a 24-hour one, never a bare "3:00". */
    const o={hour:"numeric",minute:"2-digit"};
    if(/^h2[34]$/.test(new Intl.DateTimeFormat([],o).resolvedOptions().hourCycle||""))o.hour="2-digit";
    return `It comes back at ${back.toLocaleTimeString([],o)} (midnight Pacific time).`;
  }catch(e){return "It comes back at midnight Pacific time."}
}
/* kind: "text" (a description), "list" (a recipe or meal), "photo", "label". */
function aiExplain(e,{kind="text"}={}){
  const c=e&&e.code,pic=kind==="photo"||kind==="label";
  const [title,message]=
    /^(not_configured|not_deployed|bad_key)$/.test(c)?["AI isn’t switched on yet","This group’s server doesn’t have an AI key yet, so describing food and reading photos are off. Search, scan and quick add work as usual."]:
    c==="daily_limit"?["That’s today’s AI limit",`You can use AI ${e.limit>0?e.limit:60} times a day. It resets tomorrow. Search, scan and quick add work as usual.`]:
    c==="group_limit"?["The group’s AI limit is used up","Everyone in the group shares a daily AI allowance, and today’s has run out. It resets tomorrow. Search, scan and quick add work as usual."]:

/* Before an AI sheet opens, so nobody types into a dead end. An unknown
   state is checked first; a check that cannot finish lets the sheet open,

let aiGating=false;
async function aiGate(){

/* A phone photo is several megabytes; a label reads as well at 1280 px. */
async function jpegBase64(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("image"));i.src=url});
    const w0=img.naturalWidth,h0=img.naturalHeight;
    if(!w0||!h0)throw new Error("image");
    for(const [max,q] of [[1280,.82],[1024,.7],[800,.6]]){
      const s=Math.min(1,max/Math.max(w0,h0)),c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(w0*s));c.height=Math.max(1,Math.round(h0*s));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const b64=c.toDataURL("image/jpeg",q).split(",")[1]||"";
      if(b64&&b64.length<=2400000)return b64;
    }
    throw new Error("image");
  }finally{URL.revokeObjectURL(url)}
}

}
const rowOf=(item,g,q,u)=>({item,name:item.name,ref:item.ref,n:item.n,g:Math.round(g*10)/10,q,u});
/* Counted things ("2 eggs") log as the food's own portion when one fits the
   model's weight within a quarter; otherwise as grams. */
function rowFromAI(item,ai){
  let q=ai.grams,u="g",g=ai.grams;
  if(ai.count>0){
    let best=null;
    for(const [lab,pg] of item.portions||[]){
      const d=Math.abs(pg*ai.count-ai.grams)/ai.grams;
      if(pg>0&&d<=.25&&(!best||d<best.d))best={lab,pg,d};
    }
    if(best){q=ai.count;u=best.lab;g=best.pg*ai.count}
  }
  return Object.assign(rowOf(item,g,q,u),{said:ai.said,search:ai.search||ai.name});
}
function estimateRow(ai,p){
  const n=new Array(N.length).fill(null);
  const set=(key,v)=>{if(v!=null)n[NI[key]]=Math.round(v*10)/10};
  set("kcal",ai.kcal);set("protein",aiNum(p.protein,0,100));set("fat",aiNum(p.fat,0,100));set("carbs",aiNum(p.carbs,0,100));
  set("fiber",aiNum(p.fiber,0,100));set("sugar",aiNum(p.sugar,0,100));set("satfat",aiNum(p.satfat,0,100));set("sodium",aiNum(p.sodium,0,40000));
  return Object.assign(rowOf({ref:"ai",name:ai.name,src:"Estimate",n,portions:[]},ai.grams,ai.grams,"g"),{said:ai.said,search:ai.search||ai.name});
}
/* The top search hit, if its calories agree with the model's within 35%,
   and so do its carbs and protein where either has a few grams: a sauce has
   a dish's calories but not its carbs ("spaghetti with meat sauce" is not
   "Spaghetti sauce with meat"). Otherwise the model's own numbers stand, as
   an estimate. The model's words can be more exact than a database name, so
   with no hit at all the last word goes, down to two. */
function searchMatch(ai,exclude){
  if(ai.kcal==null)return null;
  const near=(a,b)=>a==null||b==null||Math.abs(a-b)<=Math.max(4,.35*Math.max(a,b));
  const ok=it=>{const k=it&&it.n&&it.n[0];return k!=null&&((k<40&&ai.kcal<40)||Math.abs(k-ai.kcal)<=.35*ai.kcal)&&
    near(it.n[NI.carbs],ai.carbs)&&near(it.n[NI.protein],ai.protein)};
  const w=(ai.search||ai.name).split(/\s+/).filter(Boolean);
  for(let n=w.length;n>=Math.min(2,w.length)&&n>0;n--){
    const top=searchItems(w.slice(0,n).join(" "),{mode:"pick",exclude})[0];
    if(top)return ok(top.item)?top.item:null;
  }
  return null;
}
/* Each thing said becomes a row: the person's own food, recipe or saved
   meal when the model named one (a meal opens into its items); else a
   search hit; else the model's own numbers, kept as an estimate. */
async function aiMatch(items,{exclude}={}){
  try{await loadUSDA()}catch(e){}
  const own=new Map(),put=(name,v)=>{const k=fold(name);if(k&&!own.has(k))own.set(k,v)};
  Object.values(S.foods).filter(live).sort((a,b)=>b.mine-a.mine).forEach(f=>{const it=foodItem(f);put(it.name,{item:it});put(f.name,{item:it})});
  Object.values(S.meta.recipes).filter(r=>live(r)&&r.id!==exclude).forEach(r=>put(r.name,{item:recipeItem(r)}));
  Object.values(S.meta.meals).filter(m=>live(m)&&m.id!==exclude).forEach(m=>put(m.name,{meal:m}));
  /* exclude is the recipe or meal being edited. It cannot contain itself:
     said there ("the usual plus a banana"), its own name means what is
     already in the list, so that item is left out. */
  const self=exclude&&(S.meta.recipes[exclude]||S.meta.meals[exclude]),selfName=self&&live(self)?fold(self.name):"";
  const rows=[];
  for(const it of (Array.isArray(items)?items:[]).slice(0,30)){
    if(!it||typeof it!=="object")continue;
    const grams=aiNum(it.grams,0,5000);if(!(grams>0))continue;
    const p=it.per100&&typeof it.per100==="object"?it.per100:{};
    const ai={name:String(it.name||it.search||"").trim().slice(0,80)||"Food",search:String(it.search||"").trim().slice(0,80),
      said:String(it.amount||"").trim().slice(0,40),grams,count:Math.round(aiNum(it.count,0,100)||0),kcal:aiNum(p.kcal,0,900),
      carbs:aiNum(p.carbs,0,100),protein:aiNum(p.protein,0,100)};
    if(selfName&&(fold(ai.search)===selfName||fold(ai.name)===selfName))continue;
    /* Own foods match on search only: the server snaps search to an own food's
       exact name when it means one, while name is just how it was said and
       can collide with an own food the model deliberately did not choose. */
    const hit=own.get(fold(ai.search));
    if(hit&&hit.meal){
      /* "Twice" is the meal twice. With no count, the model's weight only
         counts when it is clearly not one helping, to the nearest half: it
         never saw the meal's own weights, so it is a guess. */
      const its=hit.meal.items||[],tot=its.reduce((a,x)=>a+(x.g||0),0);
      let f=1;
      if(ai.count>1)f=ai.count;
      else if(!ai.count&&tot>0){const k=ai.grams/tot;if(k>=1.75||k<=.6)f=Math.max(.5,Math.round(k*2)/2)}
      const times=v=>v==null?v:Math.round(v*f*100)/100;
      for(const x of its)rows.push(Object.assign(rowOf(itemFromEntry(x),(x.g||0)*f,times(x.q),x.u||"g"),{said:"",search:x.name}));
      continue;
    }
    const item=hit?hit.item:searchMatch(ai,exclude);
    rows.push(item?rowFromAI(item,ai):estimateRow(ai,p));
  }
  return rows;
}

/* Describe: say what was eaten, or what goes into a recipe or saved meal.
   The keyboard's microphone does the listening. task "log" goes on to Check;
   "recipe" and "meal" open the editor prefilled, or add to the open one
   (into). The text stays put through any error. */
const DESCRIBE={
  log:["Describe","2 scrambled eggs, a slice of toast with butter and a flat white"],
  recipe:["Describe a recipe","Chilli for 4: 500 g beef mince, 2 tins kidney beans, a tin of chopped tomatoes, an onion, a spoon of oil"],
  meal:["Describe a meal","Usual breakfast: 60 g oats with a cup of milk, a banana and a black coffee"]};
function openDescribe({task="log",meal=guessMeal(),k,exclude,into,onAdded}={}){
  const isLog=task==="log",kind=isLog?"text":"list",name=DESCRIBE[task][0];
  let ta,photo,busy=false,gone=false;
  const prov=aiProvNote();
  const root=sheet({title:name,left:"Cancel",right:"Next",tall:true,
    dirty:()=>!gone&&!!ta.value.trim(),
    onRight:()=>{send();return false},
    build:body=>{
      const card=el("div","card");
      card.innerHTML=`<textarea class="ta" maxlength="2000" autocomplete="off" aria-label="${esc(name)}" placeholder="${esc(DESCRIBE[task][1])}"></textarea>`;
      ta=card.querySelector("textarea");
      /* Return is a new line here; Next is the bar button. */
      ta.addEventListener("input",()=>{grow();if(!busy)root.setRight("Next",!!ta.value.trim())});
      body.append(card,el("p","foot",(isLog?"":"Say what goes in and roughly how much. ")+
        "Tap the microphone on the keyboard to speak. Nothing is saved until you check it."),prov.el);
      if(isLog){
        photo=el("button","btn ghost ico",`${CAM_SVG}<span>Use a photo</span>`);photo.type="button";
        photo.onclick=()=>{if(!busy&&aiGateNow())pickPhoto(sendPhoto)};
        body.appendChild(photo);
      }
    }});
  root.setRight("Next",false);
  /* Leaving stops a request still being read (the HUD goes with it). A reply
     that lands while "Discard changes?" is up waits for the answer: Keep
     Editing shows it, Discard drops it. */
  let ctl=null,held=null;
  root.onClosed=()=>{gone=true;held=null;prov.stop();if(ctl)ctl.abort()};
  root.onKept=()=>{const h=held;held=null;if(h)h()};
  setTimeout(()=>{if(!gone)ta.focus()},80);
  function grow(){ta.style.height="auto";ta.style.height=ta.scrollHeight+"px"}
  function setBusy(on,what){
    busy=on;ta.readOnly=on;
    if(photo){photo.disabled=on;photo.lastChild.textContent=on&&what==="photo"?"Reading…":"Use a photo"}
    root.setRight(on&&what!=="photo"?"Reading…":"Next",!on&&!!ta.value.trim());
  }
  function send(){
    const text=ta.value.trim();
    if(busy)return;
    if(!text){hud("Say what you ate",WARN);ta.focus();return}
    ta.blur();setBusy(true,"text");
    run(signal=>aiCall(task,{text,context:aiContext(meal,exclude)},{signal}),kind);
  }
  function sendPhoto(file){
    if(busy||gone)return;
    setBusy(true,"photo");
    run(async signal=>{
      let image;try{image=await jpegBase64(file)}catch(e){throw aiErr("bad_image")}
      return aiCall("photo",{image,context:aiContext(meal,exclude)},{signal});
    },"photo");
  }
  async function run(call,how){
    const hide=hud(how==="photo"?"Reading the photo…":"Reading…",SPIN,{hold:true});
    let j=null,rows=null,err=null;
    ctl=new AbortController();
    try{j=await call(ctl.signal);rows=await aiMatch(j&&j.items,{exclude})}catch(e){err=e}
    ctl=null;hide();
    if(gone)return;
    const show=()=>{
      if(gone)return;
      setBusy(false);
      if(!err&&!rows.length)err=aiErr("unreadable");
      if(err){aiExplain(err,{kind:how});return}
      const done=()=>{gone=true;root.close()};
      if(isLog)openReview({rows,meal:MEAL_NAME[j.meal]?j.meal:meal,k,note:j.note,photo:how==="photo",
        onAdded:(m,n)=>{done();onAdded&&onAdded(m,n)}});
      else if(into){into(j,rows);done()}
      else openListEditor(task,null,{prefill:{j,rows},onSaved:done});
    };
    if(root.asking)held=show;else show();
  }
  return root;
}

/* Check: what was understood, before any of it is logged. A row can have
   its amount changed, another food chosen, or be removed. */
function openReview({rows,meal="s",k,note,photo,onAdded}){
  const day=k||cur,list=rows.slice();
  let m=meal,card,snap0=null;
  const snap=()=>JSON.stringify([m,list.map(x=>[x.ref,x.name,x.g,x.q,x.u])]);
  /* As said ("2 large · 100 g") until the person sets it themselves. */
  const line=x=>x.said?`${x.said} · ${photo?"about ":""}${fmtN(x.g)} g`:amountOnly(x);
  const root=sheet({title:"Check",left:"Cancel",right:"Add",tall:true,
    dirty:()=>snap0!==null&&snap()!==snap0,
    onRight:()=>{
      if(!list.length){hud("Nothing to add",WARN);return false}
      const t=now();
      list.forEach((x,i)=>putEntry(day,{m,name:x.name,ref:x.ref,n:x.n,g:x.g,q:x.q,u:x.u,c:t+i}));
      renderAll();onAdded&&onAdded(m,list.length);
    },
    build:body=>{
      body.appendChild(makeSeg(MEALS,m,v=>{m=v},"Meal"));
      card=el("div","card");card.style.marginTop="14px";
      /* The server's note names one thing to check; it never says a photo is
         an estimate, so that sentence is always ours. */
      const said=typeof note==="string"?note.trim().slice(0,200):"";
      const foot=[photo?"Portions from a photo are rough. Check the amounts.":"",said,
        "Tap an item to change it, or swipe left to remove it."].filter(Boolean).join(" ");
      body.append(card,el("p","foot",esc(foot)));
      draw();
    }});
  paintIn(root);snap0=snap();
  function draw(){
    card.innerHTML="";
    for(const x of list){
      const [tag,cls]=sourceTag(x.ref);
      const b=el("button","fr",`<span class="ft"><span class="fn">${esc(x.name)}</span><span class="fs">`+
        (tag?`<span class="tag${cls}">${tag}</span>`:"")+`${esc(line(x))}</span></span><span class="fk">${kc(kcalOf(x))}<small>kcal</small></span>`);
      b.type="button";
      card.appendChild(swipeRow(b,()=>rowMenu(b,x),()=>remove(x)));
    }
    if(!list.length)card.appendChild(el("p","empty","Nothing left to add."));
    else card.appendChild(el("div","cell",`<span class="cl" style="font-weight:600">Total</span><span class="cv">${kc(list.reduce((a,x)=>a+kcalOf(x),0))} kcal</span>`));
  }
  function remove(x){const i=list.indexOf(x);if(i>=0)list.splice(i,1);draw()}
  function rowMenu(anchor,x){
    menu(anchor,[
      {label:"Change amount",onSelect:()=>openAmount(Object.assign({},x.item,{q:x.q,u:x.u}),{mode:"pick",right:"Done",title:"Change amount",
        onDone:y=>{Object.assign(x,{g:y.g,q:y.q,u:y.u,said:""});draw()}})},
      /* "Choose another food" is too long for a sheet title at 320. */
      {label:"Choose another food",onSelect:()=>openPicker({mode:"pick",title:"Another food",query:x.search||x.name,grams:x.g,right:"Done",
        onPick:y=>{Object.assign(x,{item:itemFromEntry(y),name:y.name,ref:y.ref,n:y.n,g:y.g,q:y.q,u:y.u,said:""});draw()}})},
      {label:"Remove",destructive:true,onSelect:()=>remove(x)}]);
  }
  return root;
}

   Sheets for logging

/* A one-field sheet. check returns true, or a message to refuse with. */
function promptText({title,placeholder="",value="",numeric,check,right="Done",note}){
  return new Promise(res=>{
    let done=false,inp;
    const root=sheet({title,left:"Cancel",right,
      onRight:()=>{
        const v=inp.value.trim();const c=check?check(v):!!v;
        if(c!==true){hud(typeof c==="string"?c:"Fill this in",WARN);inp.focus();return false}
        done=true;res(v);
      },
      build:(body,sh)=>{
        const card=el("div","card");
        card.innerHTML=`<label class="cell"><input class="cin left" autocomplete="off" autocorrect="off" spellcheck="false"
          ${numeric?'inputmode="numeric"':""} placeholder="${esc(placeholder)}" aria-label="${esc(title)}"></label>`;
        inp=card.querySelector("input");inp.value=value;

    setTimeout(()=>inp&&inp.focus(),80);
  });
}

/* Labelled input row: <label> so a tap anywhere on the row focuses it. */
/* unit:"" on a numeric row with no unit keeps the column, so the values in a
   card share one right edge; text rows leave unit out. */
function fieldRow(label,{value="",placeholder="",unit=null,mode="decimal",left,attrs=""}={}){
  return `<label class="cell"><span class="cl" style="flex:none;max-width:52%">${esc(label)}</span>`+
    `<input class="cin${left?" left":""}" ${mode?`inputmode="${mode}"`:""} autocomplete="off" autocorrect="off" spellcheck="false" ${attrs}
      value="${esc(value)}" placeholder="${esc(placeholder)}" aria-label="${esc(label)}">`+
    (unit!=null?`<span class="unit">${esc(unit)}</span>`:"")+`</label>`;
}
/* Deferred, so the caret a tap places cannot undo the selection. */
const selectOnFocus=root=>root.querySelectorAll("input").forEach(i=>i.addEventListener("focus",()=>setTimeout(()=>{try{i.select()}catch(e){}},0)));
/* Return walks the fields, as the keyboard's Next key does, and submits from
   the last one. */
function formKeys(root,submit){
  const ins=[...root.querySelectorAll("input:not([type=search]):not(:disabled)")];
  ins.forEach((i,j)=>{
    const last=j===ins.length-1;
    i.setAttribute("enterkeyhint",last?"done":"next");
    i.addEventListener("keydown",e=>{
      if(e.key!=="Enter"||e.isComposing)return;
      e.preventDefault();
      if(!last)ins[j+1].focus();else if(submit)submit();
    });
  });
}

/* ---- Search + add ----
   mode "log" adds to the diary and stays open for the next item;
   mode "pick" returns one item (a recipe ingredient, a meal item). */
/* query prefills the search (Choose another food); grams opens the amount
   at that weight, so a swapped food keeps what was eaten. */
/* right: the amount sheet's verb in pick mode ("Done" for a sub-edit). */
function openPicker({meal="s",k,mode="log",exclude,title,onPick,query="",grams,right}={}){
  let timer=null,added=0,input,list;
  const day=k||cur;
  const root=sheet({title:title||(mode==="log"?MEAL_NAME[meal]:"Add an item"),left:"Cancel",tall:true,build:body=>{
    const sw=el("div","search",SEARCH_SVG+`<input type="search" placeholder="Search foods" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Search foods" enterkeyhint="search">`+
      `<button class="clr hidden" type="button" aria-label="Clear search">${XMARK}</button>`);
    input=sw.querySelector("input");
    input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();input.blur()}});
    /* The picker stays open for the next item, so clearing is routine. A
       pending debounced render must not run after it. */
    const clr=sw.querySelector(".clr");
    clr.onclick=()=>{input.value="";clr.classList.add("hidden");input.focus();clearTimeout(timer);render()};
    if(query){input.value=query;clr.classList.remove("hidden")}
    const acts=el("div","acts"+(mode==="log"?" four":" two"));
    acts.innerHTML=(mode==="log"?`<button class="act" type="button" data-a="describe">${WAVE_SVG}<span>Describe</span></button>`:"")+
      `<button class="act" type="button" data-a="scan">${SCAN_SVG}<span>Scan</span></button>`+
      (mode==="log"?`<button class="act" type="button" data-a="quick">${BOLT_SVG}<span>Quick add</span></button>`:"")+
      `<button class="act" type="button" data-a="new">${NEW_SVG}<span>New food</span></button>`;
    list=el("div");
    body.append(sw,acts,list);
    acts.addEventListener("click",e=>{
      const a=e.target.closest("[data-a]");if(!a)return;haptic();
      if(a.dataset.a==="describe")aiGate().then(ok=>{if(ok)openDescribe({task:"log",meal,k:day,onAdded:afterAdd})});
      if(a.dataset.a==="scan")openScanner(code=>handleBarcode(code,choose));
      if(a.dataset.a==="quick")openQuickAdd({k:day,meal,onDone:m=>afterAdd(m)});
      if(a.dataset.a==="new")openFoodEditor(null,{onSaved:f=>choose(foodItem(f))});
    });
    input.addEventListener("input",()=>{clr.classList.toggle("hidden",!input.value);clearTimeout(timer);timer=setTimeout(render,110)});
  }});
  /* n: how many a description added at once. */
  function afterAdd(m,n){
    added+=n||1;root.setLeft("");root.setRight("Done");renderAll();
    hud(n?`Added ${n} item${n===1?"":"s"}`:`Added to ${MEAL_NAME[m]}`);
    if(!input.value)render();
  }
  function choose(item){
    if(mode==="log")openAmount(item,{mode:"log",meal,k:day,onDone:m=>afterAdd(m)});
    else openAmount(grams>0?Object.assign({},item,{q:grams,u:"g"}):item,{mode:"pick",right,onDone:x=>{onPick&&onPick(x);root.close()}});
  }
  const itemRow=(item,right,small,sub)=>{
    const b=el("button","fr",`<span class="ft"><span class="fn">${esc(item.name)}</span>`+
      `<span class="fs">${esc(sub||`${item.src} · ${g1(item.n&&item.n[NI.protein])} g protein`)}</span></span>`+
      `<span class="fk">${right}<small>${esc(small)}</small></span>`);
    b.type="button";b.onclick=()=>{haptic();choose(item)};
    return b;
  };
  const mealRow=m=>{
    const kcal=(m.items||[]).reduce((a,x)=>a+kcalOf(x),0);
    const b=el("button","fr",`<span class="ft"><span class="fn">${esc(m.name)}</span>`+
      `<span class="fs">Saved meal · ${m.items.length} item${m.items.length===1?"":"s"}</span></span><span class="fk">${kc(kcal)}<small>kcal</small></span>`);
    b.type="button";
    b.onclick=()=>{haptic();logMeal(m,day,meal);afterAdd(meal)};
    return b;
  };
  function section(title,rows){
    if(!rows.length)return;
    list.appendChild(el("div","shdr",`<h2 class="t">${esc(title)}</h2>`));
    const c=el("div","card");rows.forEach(r=>c.appendChild(r));list.appendChild(c);
  }
  function render(){
    const q=input.value.trim();
    list.innerHTML="";
    if(!q){
      const rec=recents(mode==="log"?meal:"").slice(0,25);
      section("Recent",rec.map(r=>itemRow(itemFromEntry(r.e),kc(kcalOf(r.e)),"kcal",amountText(r.e))));
      if(mode==="log")section("Saved meals",Object.values(S.meta.meals).filter(live).sort((a,b)=>a.name.localeCompare(b.name)).map(mealRow));
      if(!list.children.length)list.appendChild(el("p","foot",
        `Search ${USDA?fmtN(USDA.length):"thousands of"} foods, scan a barcode, or add your own. Foods you log show up here next time.`));
      return;
    }
    const res=searchItems(q,{mode,exclude});
    const rows=res.map(r=>r.meal?mealRow(r.meal):itemRow(r.item,kc(r.item.n&&r.item.n[0]),"per 100 g"));
    if(rows.length){const c=el("div","card");c.style.marginTop="14px";rows.forEach(r=>c.appendChild(r));list.appendChild(c)}
    if(!USDA){
      list.appendChild(el("p","foot","Loading the food database…"));
      loadUSDA().then(()=>{if(input.value.trim()===q)render()},()=>{
        list.appendChild(el("p","foot err","The food database did not load. Your own foods still work."))});
    }else if(!rows.length){
      list.appendChild(el("p","foot",`Nothing matches “${esc(q)}”. Try fewer words, or add it as a new food.`));
    }
  }
  render();
  loadUSDA().catch(()=>{});
  /* With a query there are results to see, not a keyboard. */
  if(!query)setTimeout(()=>input.focus(),80);
  return root;
}

/* ---- Amount: how much of one item ---- */
/* right:"Done" for a sub-edit inside an editor that has its own Save. Only a
   new amount takes focus. */
function openAmount(item,{mode="log",meal="s",k,entry,onDone,onRemove,right,title:t0,focus=mode!=="edit"}={}){
  const day=k||cur;
  let u=item.u||"g",q=item.q;
  if(q==null){
    /* A serving or a piece is a sensible start; a whole pack or pot is not. */
    const first=(item.portions||[]).find(p=>!/^(1 pack|whole recipe)$/.test(p[0]));
    if(first){u=first[0];q=1}else{u="g";q=100}
  }
  if(unitGrams(item,u)==null){u="g";q=entry?entry.g:100}
  let m=entry?entry.m:meal;
  let inp,unitLbl,out;
  const title=t0||(mode==="edit"?"Edit entry":mode==="pick"?(onRemove?"Edit item":"Amount"):MEAL_NAME[m]||"Add");
  const root=sheet({title,left:"Cancel",right:right||(mode==="edit"?"Save":"Add"),onRight:()=>save(),build:(body,sh)=>{
    body.innerHTML=`<div class="fd-name">${esc(item.name)}</div>
      <div class="fd-src">${esc(item.src)} · ${per100Text(item.n)}</div>
      <div class="card"><label class="cell amt"><span class="cl" style="flex:none">Amount</span>
        <input class="cin" inputmode="decimal" autocomplete="off" aria-label="Amount">
        <button class="unitbtn" type="button" aria-label="Unit"><span></span>${UPDOWN}</button></label></div>
      <div class="card" style="margin-top:12px"><div class="fd-kcal"><b class="num">0</b><span>kcal</span></div><div class="macros"></div></div>`;

const fmtQ=x=>{if(!(x>0))return "";const r=x>=20?Math.round(x):Math.round(x*100)/100;return String(r)};

/* ---- New or edit a food. Foods are shared with the group. ---- */
const LABEL_FIELDS=[["Calories","kcal",0,"kcal"],["Protein","protein",NI.protein,"g"],["Carbohydrate","carbs",NI.carbs,"g"],
  ["of which sugars","sugar",NI.sugar,"g"],["Fat","fat",NI.fat,"g"],["of which saturates","satfat",NI.satfat,"g"],
  ["Fibre","fiber",NI.fiber,"g"],["Salt","salt",NI.sodium,"g"]];
function openFoodEditor(food,{barcode,name,brand,onSaved}={}){
  const f=food||{};const mine=!food||f.mine;
  const serving0=(f.portions||[]).find(p=>/^1 serving/.test(p[0]));
  let basis="100",seg=null,gone=false,extra=[],extraCode="",prov=null;
  let snap0=null;
  /* Inputs by position: name, brand, barcode, serving, then LABEL_FIELDS. */
  const inputs=()=>[...root.body.querySelectorAll("input")];
  const snapOf=()=>JSON.stringify(inputs().map(i=>i.value).concat(basis));
  const root=sheet({title:food?(mine?"Edit food":"Food"):"New food",left:mine?"Cancel":"",right:mine?(food?"Save":"Add"):"Done",tall:true,
    dirty:()=>mine&&snap0!==null&&snapOf()!==snap0,
    onRight:()=>mine?save():undefined,build:(body,sh)=>{
    const n=f.n||[];
    const val=(i,key)=>n[i]==null?"":key==="salt"?Math.round(n[i]/400*100)/100:n[i];
    body.innerHTML=(mine?`<button class="btn ghost ico" type="button" data-label style="margin:2px 0 12px">${CAM_SVG}<span>Read the label</span></button>`:"")+
      `<div class="card">
        ${fieldRow("Name",{value:f.name||name||"",placeholder:"Required",mode:"",left:false})}
        ${fieldRow("Brand",{value:f.brand||brand||"",placeholder:"Optional",mode:""})}
        ${fieldRow("Barcode",{value:f.barcode||barcode||"",placeholder:"Optional",mode:"numeric"})}
      </div>
      <div class="shdr"><h2 class="t">Nutrition as on the label</h2></div>
      <div class="card"><div class="segwrap" data-basis></div>
        ${fieldRow("Serving size",{value:serving0?serving0[1]:"",placeholder:"Optional",unit:"g"})}</div>
      <div class="card" style="margin-top:12px">${LABEL_FIELDS.map(([l,key,i,u])=>fieldRow(l,{value:val(i,key),placeholder:key==="kcal"?"Required":"",unit:u})).join("")}</div>
      <p class="foot">${mine?"Foods you add are shared with everyone in the group, so a product only has to be typed in once. Your diary stays private.":"Added by someone else in the group, so only they can change it."}</p>`;
    /* The toggle converts what is on screen, so a food never changes by being

    seg=makeSeg([["100","Per 100 g"],["serving","Per serving"]],basis,v=>{

      if(vals.some(i=>num(i.value)!=null)){

        vals.forEach(i=>{const x=num(i.value);if(x!=null)i.value=String(Math.round(x*k*100)/100)});
      }

    },"Values are");
    body.querySelector("[data-basis]").appendChild(seg);
    /* Someone else's food is read-only, and stored values are always per 100 g. */
    if(!mine){body.querySelectorAll("input").forEach(i=>i.disabled=true);body.querySelector("[data-basis]").remove();
      body.querySelector(".shdr .t").textContent="Nutrition per 100 g"}
    else{
      /* The barcode field stays for typing; the button beside it scans. */
      const sb=el("button","fscan",SCAN_SVG.replace('width="26" height="26"','width="24" height="24"'));
      sb.type="button";sb.setAttribute("aria-label","Scan a barcode");
      sb.onclick=()=>{haptic();openScanner(gotCode)};
      body.querySelectorAll("input")[2].parentElement.appendChild(sb);
      const rl=body.querySelector("[data-label]");
      rl.onclick=()=>{if(aiGateNow("label"))pickPhoto(readLabel)};
      /* Under the button it is about, before anything is sent. */
      prov=aiProvNote("foot under-btn");rl.after(prov.el);
    }
    selectOnFocus(body);formKeys(body,sh.submit);
    const log=el("button","btn ghost","Log it");
    if(food&&live(food)){
      log.onclick=()=>{root.close();setTimeout(()=>openAmount(foodItem(food),{mode:"log",meal:guessMeal(),k:todayKey(),onDone:m=>hud(`Added to ${MEAL_NAME[m]}`)}),300)};
      body.appendChild(log);
    }
    if(food&&mine){
      const del=el("button","btn danger","Delete food");
      del.onclick=async()=>{
        if(!await confirmBox("Delete this food?","It disappears from search for everyone in the group. Entries already logged keep their numbers."))return;
        S.foods[f.id]=Object.assign({},f,{del:1,t:now()});dirtyFood(f.id);root.close();renderAll();hud("Deleted");
      };
      body.appendChild(del);
    }
  }});
  paintIn(root);
  snap0=snapOf();
  root.onClosed=()=>{gone=true;if(prov)prov.stop()};
  /* So Read the label knows whether AI is on by the time it is tapped. */
  if(mine&&S.key&&navigator.onLine!==false&&aiStale())aiStatus();
  /* A scanned code: if the group already has that product, say so; else ask
     Open Food Facts and fill only what is still empty. */
  async function gotCode(code){
    if(gone)return;
    const ins=inputs(),bc=ins[2],prev=bc.value;
    bc.value=code;
    const known=Object.values(S.foods).find(x=>live(x)&&x.barcode===code&&x.id!==f.id);
    if(known){
      /* Adding from a picker, the food it already is goes straight on to its
         amount, as a scan in the picker does. Elsewhere it opens. */
      const use=!food&&!!onSaved;
      const go=await alertBox({title:"Already added",message:`${foodItem(known).name} has this barcode.`,
        actions:[{label:"Cancel",style:"cancel",value:false},{label:use?"Use it":"Open it",value:true}]});
      /* Two foods cannot share a code, so it does not stay in this one. */
      bc.value=prev;
      if(go!==true||gone)return;
      /* Anything typed here is not lost without asking. Opening stacks the
         other food over this one instead, so there is nothing to ask. */
      const typed=snapOf()!==snap0;
      if(use){
        if(typed&&await alertBox({title:"Discard changes?",actions:[{label:"Keep Editing",style:"cancel",value:false},
          {label:"Discard",style:"destructive",value:true}]})!==true)return;
        if(gone)return;
        root.close();setTimeout(()=>onSaved(known),300);
      }
      else if(!food&&!typed){root.close();setTimeout(()=>openFoodEditor(known),300)}
      else openFoodEditor(known);

    }
    /* The lookup and a label being read would both fill the same fields. */
    const sb=root.body.querySelector(".fscan"),rl=root.body.querySelector("[data-label]");
    sb.disabled=true;if(rl)rl.disabled=true;
    const hide=hud("Looking it up…",SEARCH_SVG.replace('width="16" height="16"','width="34" height="34"'),{hold:true});
    let p=null;
    try{p=await offLookup(code)}catch(e){}finally{hide();sb.disabled=false;if(rl)rl.disabled=false}
    if(gone||!p||bc.value!==code)return;
    if(fillFromOFF(offToFood(code,p)))hud("Filled in from Open Food Facts");
  }
  function fillFromOFF(o){
    const ins=inputs();let did=false;
    const put=(i,v)=>{if(v!=null&&v!==""&&!ins[i].value.trim()){ins[i].value=String(v);did=true}};
    if(o.name&&!/^Product \d+$/.test(o.name))put(0,o.name);
    put(1,o.brand);
    if(o.partial)return did;
    const sv=(o.portions||[]).find(p=>/^1 serving/.test(p[0]));
    if(sv)put(3,Math.round(sv[1]*10)/10);
    /* Its values are per 100 g. An empty form switches to that; one with
       numbers per serving takes them converted, if the serving is known. */
    const vals=ins.slice(4);
    if(basis!=="100"&&vals.every(i=>!i.value.trim())){basis="100";segSet(seg,"100")}
    const sg=num(ins[3].value),k=basis==="100"?1:sg>0?sg/100:null;
    if(k!=null)LABEL_FIELDS.forEach(([,key,i],j)=>{const v=o.n[i];if(v!=null)put(4+j,Math.round((key==="salt"?v/400:v)*k*100)/100)});

  }
  /* A photo of the label, read by the model. Name and brand only fill when
     empty; the numbers are what the label says, so they replace. */
  async function readLabel(file){
    if(gone)return;
    const btn=root.body.querySelector("[data-label]"),sb=root.body.querySelector(".fscan");
    btn.disabled=true;btn.lastChild.textContent="Reading…";if(sb)sb.disabled=true;
    const hide=hud("Reading the label…",SPIN,{hold:true});
    let j=null,err=null;
    try{
      let image;try{image=await jpegBase64(file)}catch(e){throw aiErr("bad_image")}
      j=await aiCall("label",{image});
    }catch(e){err=e}
    hide();
    if(gone)return;
    btn.disabled=false;btn.lastChild.textContent="Read the label";if(sb)sb.disabled=false;
    if(err)return aiExplain(err,{kind:"label"});
    if(!j||!j.found)return tellUser("That doesn’t look like a nutrition label","Take the photo straight on, with the nutrition table filling most of the frame.");
    const ins=inputs(),str=v=>typeof v==="string"?v.trim().slice(0,80):"";
    if(!ins[0].value.trim()&&str(j.name))ins[0].value=str(j.name);
    if(!ins[1].value.trim()&&str(j.brand))ins[1].value=str(j.brand);
    const nb=j.basis==="serving"?"serving":"100",sg=aiNum(j.serving_grams,0,5000);
    if(sg>0)ins[3].value=String(Math.round(sg*10)/10);
    const v={kcal:j.kcal,protein:j.protein,carbs:j.carbs,sugar:j.sugar,fat:j.fat,satfat:j.satfat,fiber:j.fiber,salt:j.salt};
    LABEL_FIELDS.forEach(([,key],i)=>{
      const x=v[key];
      if(typeof x==="number"&&isFinite(x)&&x>=0)ins[4+i].value=String(Math.round(x*100)/100);
      /* A number typed for the other basis would now read wrong. */

    if(note){await tellUser("Filled in — check the numbers",note);if(gone)return}

    const vals=ins.slice(4).map(i=>num(i.value));
    if(!(vals[0]>0)&&vals[0]!==0){hud("Enter the calories",WARN);ins[4].focus();return false}
    if(basis==="serving"&&!(sv>0)){hud("Enter the serving size",WARN);ins[3].focus();return false}

    LABEL_FIELDS.forEach(([,key,i],j)=>{
      const v=vals[j];if(v==null)return;

    });

       that id is free, so another member's food, or its tombstone, is never
       overwritten. */
    const clash=bc&&Object.values(S.foods).find(x=>live(x)&&x.barcode===bc&&x.id!==f.id);
    if(clash){hud(`That barcode is already ${clash.name}`,WARN);ins[2].focus();return false}
    const portions=(f.portions||[]).filter(p=>!/^1 serving/.test(p[0]));
    /* A pack size from Open Food Facts, while the code it came with stays. */
    if(bc&&bc===extraCode)for(const p of extra)if(!portions.some(x=>x[0]===p[0]))portions.push(p);

const guessMeal=()=>{const h=new Date().getHours();return h<11?"b":h<15?"l":h<21?"d":"s"};

function openListEditor(kind,src,{prefill,onSaved}={}){

    body.innerHTML=`<div class="card">${fieldRow("Name",{value:r.name,placeholder:isR?"e.g. Chilli con carne":"e.g. Usual breakfast",mode:""})}</div>
      <div class="shdr"><h2 class="t">${isR?"Ingredients":"Items"}</h2><span class="x" data-raw></span></div>
      <div class="card" data-items></div>

        ${fieldRow("Servings",{value:r.serv||"",unit:"",placeholder:"Optional"})}</div>
      <p class="foot">Weigh the dish once it is cooked, without the pot. Cooking adds or loses water, so this is what makes a gram of the finished dish right. Left empty, the raw weight is used.</p>`:""}
      <div class="card" style="margin-top:22px" data-sum></div>`;
    nameIn=body.querySelector("input");
    itemsCard=body.querySelector("[data-items]");summary=body.querySelector("[data-sum]");rawEl=body.querySelector("[data-raw]");
    if(isR){const ins=body.querySelectorAll("input");cookedIn=ins[1];servIn=ins[2];
      [cookedIn,servIn].forEach(i=>i.addEventListener("input",()=>{r.cooked=num(cookedIn.value);r.serv=num(servIn.value);drawSum()}))}
    selectOnFocus(body);formKeys(body,sh.submit);
    if(src&&live(src)){
      const log=el("button","btn ghost",isR?"Log a portion":"Log this meal");
      /* Edits are saved first, so what is logged is what is on screen. An
         untouched one is not re-stamped: newest wins, and that would undo a
         newer edit from the other phone. The library logs to today. */
      const keep=()=>snap()===snap0||save(true)!==false;
      log.onclick=e=>{
        if(isR){if(!keep())return;root.close();setTimeout(()=>openAmount(recipeItem(store[r.id]),{mode:"log",meal:guessMeal(),k:todayKey(),onDone:m=>hud(`Added to ${MEAL_NAME[m]}`)}),300);return}
        menu(e.currentTarget,MEALS.map(([v,t])=>({label:`Add to ${t}`,onSelect:()=>{if(!keep())return;root.close();logMeal(store[r.id],todayKey(),v);renderAll();hud(`Added to ${t}`)}})));

  const snap=()=>JSON.stringify([nameIn.value.trim(),r.items,isR?num(cookedIn.value):0,isR?num(servIn.value):0]);
  const snap0=snap();

  function addDescribed(j,rows,quiet){

    const nt=typeof j.note==="string"?j.note.trim().slice(0,200):"";

    const tot=totals(r.items).t;
    let rows=[["Calories",`${kc(tot[0])} kcal`],["Protein",`${g1(tot[NI.protein])} g`],["Carbs",`${g1(tot[NI.carbs])} g`],["Fat",`${g1(tot[NI.fat])} g`]];
    if(isR){
      const info=recipeInfo(r);
      if(info.serving)rows.push(["Per serving",`${kc(info.total/r.serv)} kcal · ${fmtN(info.serving)} g`]);
      if(info.weight>0)rows.push(["Per 100 g",`${kc(info.per100[0])} kcal`]);
    }
    summary.innerHTML=rows.map(([a,b])=>`<div class="cell"><span class="cl">${a}</span><span class="cv">${b}</span></div>`).join("");
  }
  /* quiet: saved on the way to logging, whose own HUD follows. */
  function save(quiet){
    r.name=nameIn.value.trim();
    if(!r.name){hud("Give it a name",WARN);nameIn.focus();return false}
    if(!r.items.length){hud(isR?"Add an ingredient":"Add an item",WARN);return false}
    if(isR){r.cooked=num(cookedIn.value)||null;r.serv=num(servIn.value)||null}
    r.t=now();store[r.id]=r;dirtyMeta();renderAll();if(!quiet)hud("Saved");
    onSaved&&onSaved(r);
  }
  return root;
}

let cur=todayKey();
function dayTitle(){

  if(diff===0)return "Today";
  if(diff===1)return "Yesterday";
  if(diff<7)return fmt(cur,{weekday:"long"});
  return fmt(cur,fromKey(cur).getFullYear()===new Date().getFullYear()?{day:"numeric",month:"long"}:{day:"numeric",month:"short",year:"numeric"});
}
function macroCell(label,have,goal,c){

    `<div class="bar${pct>1.05?" over":""}"><span style="width:${Math.min(100,pct*100).toFixed(1)}%;background:var(--${c})"></span></div>`+
    `<div class="mv">${fmtN(Math.round(have))} <small>/ ${fmtN(goal)} g</small></div></div>`;
}

/* A USDA entry tapped before the database has loaded would open on its logged

function editEntry(e){
  if(e.u==="quick")return openQuickAdd({k:cur,entry:e});
  /* The day is taken now: the diary may move on while this waits. */
  const k=cur,go=()=>openAmount(itemFromEntry(e),{mode:"edit",entry:e,k});
  if(USDA||!/^u:/.test(e.ref||""))return go();
  if(editEntry.wait)return;

/* A moving average over weigh-ins, so one salty dinner does not read as a
   kilo gained. Each weigh-in moves the trend a quarter of the way to it. */
function trendOf(ws){let t=null;return ws.map(w=>{t=t==null?w.kg:t+.25*(w.kg-t);return Object.assign({},w,{t})})}
/* label names the chart for VoiceOver, which otherwise reads only "image". */
function chartSVG({W=340,H=170,xs,ymin,ymax,ylabels,body,label}){
  const L=34,Rr=6,T=8,B=20;
  const x=i=>L+(xs<=1?0:i/(xs-1))*(W-L-Rr);
  const y=v=>T+(1-(v-ymin)/(ymax-ymin||1))*(H-T-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img"${label?` aria-label="${esc(label)}"`:""}>`;
  for(const v of ylabels)s+=`<line class="gl" x1="${L}" x2="${W-Rr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="ax" x="${L-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${fmtN(v,1)}</text>`;
  s+=body(x,y,{L,R:W-Rr,T,B:H-B,W,H})+"</svg>";
  return s;
}
const niceStep=span=>{const raw=span/3,p=Math.pow(10,Math.floor(Math.log10(raw||1))),m=raw/p;return (m<1.5?1:m<3?2:m<7?5:10)*p};
function renderProgress(){
  segSet($("rangeSeg"),range,"r");
  const end=todayKey(),start=shiftKey(end,-(range-1)),xs=range;
  const idx=k=>daysBetween(start,k);
  const all=trendOf(weighIns());
  const ws=all.filter(w=>w.k>=start);
  const wc=$("weightCard");
  /* Drawn at the card's own width, so the 11px axis labels stay 11px. */
  const CW=Math.max(240,(wc.clientWidth||364)-24);
  if(!ws.length){
    wc.innerHTML=`<p class="empty">No weigh-ins in this period. Log your weight a few times a week and the trend shows here — it is what tells you whether the calorie target is right for you.</p>`;
  }else{
    const vals=ws.flatMap(w=>[w.kg,w.t]);
    let lo=Math.min(...vals),hi=Math.max(...vals);
    if(hi-lo<2){const m=(hi+lo)/2;lo=m-1;hi=m+1}
    const st=niceStep(hi-lo);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;
    const yl=[];for(let v=lo;v<=hi+1e-9;v+=st)yl.push(Math.round(v*10)/10);
    const first=ws[0],last=ws[ws.length-1],ch=last.t-first.t;
    wc.innerHTML=`<div class="chart-cap"><b>${fmtN(last.t,1)} kg</b><span>${ws.length>1?`${ch>0?"+":ch<0?"−":"±"}${fmtN(Math.abs(ch),1)} kg trend since ${esc(fmt(first.k,{day:"numeric",month:"short",...yearIf(first.k)}))}`:"trend"}</span></div>
      <div class="chart">${chartSVG({W:CW,xs,ymin:lo,ymax:hi,ylabels:yl,
        label:ws.length>1?`Weight trend ${fmtN(last.t,1)} kg, ${ch>=.05?"up "+fmtN(ch,1)+" kg":ch<=-.05?"down "+fmtN(-ch,1)+" kg":"unchanged"} since ${fmt(first.k,{day:"numeric",month:"short",...yearIf(first.k)})}`:`One weigh-in, ${fmtN(last.kg,1)} kg`,
        body:(x,y,b)=>{
        let s=ws.map(w=>`<circle class="pt" cx="${x(idx(w.k)).toFixed(1)}" cy="${y(w.kg).toFixed(1)}" r="2.6"/>`).join("");
        if(ws.length>1)s=`<polyline class="tl" points="${ws.map(w=>`${x(idx(w.k)).toFixed(1)},${y(w.t).toFixed(1)}`).join(" ")}"/>`+s;
        s+=`<text class="ax" x="${b.L}" y="${b.H-4}">${esc(fmt(start,{day:"numeric",month:"short",...yearIf(start)}))}</text><text class="ax" x="${b.R}" y="${b.H-4}" text-anchor="end">Today</text>`;
        return s;
      }})}</div>
      <div class="legend"><span><i style="background:var(--tint)"></i>Trend</span><span><i style="background:none;box-shadow:inset 0 0 0 1.6px var(--tint);border-radius:50%"></i>Weigh-in</span></div>`;
  }

  /* Calories: one bar a day; a year is shown as weekly averages. */
  const p=plan(end);
  const days=[];for(let i=0;i<xs;i++){const k=shiftKey(start,i);const l=entries(k);days.push({k,kcal:l.length?totals(l).t[0]:null,p:l.length?totals(l).t[NI.protein]:null})}
  const logged=days.filter(d=>d.kcal!=null);
  /* Today is still being eaten, so it would drag every average down. */
  const done=logged.filter(d=>d.k!==end);
  const kcCard=$("kcalCard");
  if(!logged.length){kcCard.innerHTML=`<p class="empty">Nothing logged in this period.</p>`}
  else{
    const weekly=range>90;
    let bars=days;
    if(weekly){bars=[];for(let i=0;i<days.length;i+=7){const w=days.slice(i,i+7).filter(d=>d.kcal!=null);bars.push({k:days[i].k,kcal:w.length?w.reduce((a,d)=>a+d.kcal,0)/w.length:null})}}
    const target=p?p.kcal:0;
    const hi=Math.max(target,...bars.map(b=>b.kcal||0))*1.08;
    const st=niceStep(hi);const yl=[];for(let v=0;v<=hi;v+=st)yl.push(v);
    const avg=done.length?done.reduce((a,d)=>a+d.kcal,0)/done.length:null;
    /* Counted over days, not weekly bars, so it matches the day count. */
    const over=done.filter(d=>target&&d.kcal>target*1.05).length;
    kcCard.innerHTML=`<div class="chart-cap"><b>${avg==null?"–":kc(avg)+" kcal"}</b><span>${done.length?`a day, over ${done.length} logged day${done.length===1?"":"s"} before today`:"no full days logged yet"}${target?` · target ${kc(target)}`:""}</span></div>
      <div class="chart">${chartSVG({W:CW,xs:bars.length,ymin:0,ymax:Math.max(yl[yl.length-1],hi),ylabels:yl,
        label:`${done.length} logged day${done.length===1?"":"s"} before today${target?`, ${over} over target by 5% or more`:""}`,
        body:(x,y,b)=>{
        const bw=Math.max(2,(b.R-b.L)/bars.length*.62);
        let s=bars.map((d,i)=>d.kcal==null?"":`<rect class="bq${target&&d.kcal>target*1.05?" o":""}" x="${(x(i)-bw/2).toFixed(1)}" y="${y(d.kcal).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,y(0)-y(d.kcal)).toFixed(1)}" rx="${Math.min(2,bw/2)}"/>`).join("");
        if(target)s+=`<line class="tg" x1="${b.L}" x2="${b.R}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}"/>`;
        return s;
      }})}</div>
      <div class="legend"><span><i style="background:var(--green)"></i>On target</span><span><i style="background:var(--red)"></i>Over by 5%+</span>${weekly?"<span>Weekly averages</span>":""}</div>`;
  }

  const pAvg=done.length?done.reduce((a,d)=>a+d.p,0)/done.length:null;
  /* The scale and the diary's answer once there is enough of both; until
     then the formula's, with what is still missing. */
  const mb=measuredBurn(end);
  const tiles=[
    ["Average protein",pAvg==null?"–":`${fmtN(Math.round(pAvg))}<small> g</small>`,p?`target ${fmtN(p.protein)} g`:""],
    ["Days logged",`${logged.length}<small> / ${range}</small>`,"days with any food"],
    mb.kcal?["Measured burn",`${kc(mb.kcal)}<small> kcal</small>`,`from ${mb.days} days`]:
      ["Estimated burn",p?`${kc(p.formula)}<small> kcal</small>`:"–",esc(mb.need)],
    ["Weigh-ins",String(ws.length),ws.length?`last ${esc(fmt(ws[ws.length-1].k,{day:"numeric",month:"short",...yearIf(ws[ws.length-1].k)}))}`:"none in this period"]];
  $("progTiles").innerHTML=tiles.map(([a,b,c])=>`<div class="tile"><span>${a}</span><b>${b}</b><small class="s">${c}</small></div>`).join("");

  const wl=$("weighins");wl.innerHTML="";
  const recent=weighIns().reverse().slice(0,12);
  for(const w of recent){
    const b=el("button","cell",`<span class="cl">${esc(fmt(w.k,{weekday:"short",day:"numeric",month:"short",...yearIf(w.k)}))}</span><span class="cv">${fmtN(w.kg,1)} kg</span>${CHEV}`);
    b.type="button";
    wl.appendChild(swipeRow(b,()=>openWeight(w.k),()=>{setWeight(w.k,0);renderAll();hud("Deleted")}));
  }
  if(!recent.length)wl.appendChild(el("p","empty","None yet."));
}

/* Day, month and year in the order this phone writes a date. */
function dateOrder(){
  try{
    const o=new Intl.DateTimeFormat(undefined,{day:"numeric",month:"long",year:"numeric"})
      .formatToParts(new Date(2000,0,2)).map(x=>x.type).filter(t=>t==="day"||t==="month"||t==="year");
    if(o.length===3)return o;
  }catch(e){}
  return["day","month","year"];
}
const AGE_MIN=13,AGE_MAX=100;
/* Three wheels for a birthday, ages 13 to 100. A day past the end of the
   month (31 February) slides back to the last real day, as UIDatePicker does. */
function birthdayWheels(value,onChange){
  const yNow=new Date().getFullYear(),yMin=yNow-AGE_MAX,yMax=yNow-AGE_MIN;
  let[y,m,d]=value.split("-").map(Number);y=clampNum(y,yMin,yMax);
  const years=[];for(let i=yMin;i<=yMax;i++)years.push(String(i));
  const cols={};
  /* Placing the wheels scrolls them too, which would read as a choice. Only
     a touch, a click, a scroll wheel or a key counts. */
  let armed=false;const arm=()=>{armed=true};
  const commit=()=>{
    if(!armed)return;
    const last=new Date(y,m,0).getDate();
    if(d>last){d=last;cols.day.setTo(d-1)}
    onChange(`${y}-${pad(m)}-${pad(d)}`);
  };
  cols.day=wheel(Array.from({length:31},(_,i)=>String(i+1)),d-1,i=>{d=i+1;commit()});
  cols.month=wheel(MONTHS,m-1,i=>{m=i+1;commit()});
  cols.year=wheel(years,y-yMin,i=>{y=yMin+i;commit()});
  const box=el("div","bday wheels");
  ["pointerdown","touchstart","wheel","keydown"].forEach(t=>box.addEventListener(t,arm,{passive:true}));
  const order=dateOrder();
  box.style.gridTemplateColumns=order.map(t=>t==="month"?"1.7fr":t==="year"?"1fr":".7fr").join(" ");
  order.forEach(t=>{cols[t].setAttribute("aria-label",t[0].toUpperCase()+t.slice(1));box.appendChild(cols[t])});
  box.init=()=>order.forEach(t=>cols[t].init());
  return box;
}

const GOALS=[["lose","Lose fat"],["maintain","Maintain"],["gain","Build muscle"]];
const goalText=g=>g.type==="maintain"?"Maintain":`${g.type==="lose"?"Lose fat":"Build muscle"} · ${g.pace==="fast"?"faster":"steady"}`;
function profileForm(init){

    <div class="card">

      <button class="cell" type="button" data-bd aria-expanded="false"><span class="cl" style="flex:none">Birthday</span><span class="cv" style="flex:1"></span></button>

  /* Birthday row. Opening the wheels sets nothing; turning one does, so a
     glance never saves a made-up date. A profile that only knows the year
     shows the year until a day is chosen. */
  const bRow=node.querySelector("[data-bd]"),bBox=node.querySelector("[data-bdw]"),bVal=bRow.querySelector(".cv");
  let bWheels=null;
  const bdText=()=>d.bd?fmt(d.bd,{day:"numeric",month:"long",year:"numeric"}):d.by?String(d.by):"";
  const showBd=()=>{const t=bdText();bVal.textContent=t||"Required";bVal.style.color=t?"":"var(--lab3)"};
  const setOpen=open=>{
    bBox.classList.toggle("hidden",!open);bRow.setAttribute("aria-expanded",String(open));
    if(open&&!bWheels){
      const start=d.bd||(d.by?`${d.by}-07-01`:`${new Date().getFullYear()-30}-01-01`);
      bWheels=birthdayWheels(start,v=>{d.bd=v;d.by=+v.slice(0,4);showBd();upd()});
      bBox.appendChild(bWheels);
    }
    if(open)bWheels.init();   /* scroll positions need the wheels on screen */
  };
  bRow.onclick=()=>{haptic();setOpen(bBox.classList.contains("hidden"))};
  ins.forEach(i=>i.addEventListener("focus",()=>setOpen(false)));
  showBd();

  const age=()=>ageOf({bd:d.bd,by:d.by});
  function valid(){const a=age();return !!(d.sex&&a>=AGE_MIN&&a<=AGE_MAX&&d.cm>=120&&d.cm<=230&&d.kg>=30&&d.kg<=300)}
  /* The action stays disabled until valid, so the note has to say why. */
  function problem(){
    const a=age();
    if(a!=null&&!(a>=AGE_MIN&&a<=AGE_MAX))return `You need to be between ${AGE_MIN} and ${AGE_MAX}.`;
    if(d.cm!=null&&!(d.cm>=120&&d.cm<=230))return "Height must be between 120 and 230 cm.";
    if(d.kg!=null&&!(d.kg>=30&&d.kg<=300))return "Weight must be between 30 and 300 kg.";

  function value(){
    const profile={sex:d.sex,by:d.bd?+d.bd.slice(0,4):d.by,cm:d.cm,kg:d.kg,act:d.act};

  }
  function upd(){

    node.querySelector("[data-actdesc]").textContent=a[2]+". Count your job and daily walking, not only workouts.";
    node.querySelector("[data-pace]").classList.toggle("hidden",d.type==="maintain");
    const res=node.querySelector("[data-result]"),note=node.querySelector("[data-note]"),pd=node.querySelector("[data-pacedesc]");
    if(!valid()){
      res.innerHTML="";note.textContent=problem()||"Fill in your sex, birthday, height and weight to see your numbers.";
      pd.textContent="";if(node.onValid)node.onValid(false);return;
    }
    const v=value();const pl=plan(null,v);
    const r=RATE[d.type][d.pace];
    pd.textContent=d.type==="maintain"?"Eat what you burn. Good for building muscle slowly while staying lean.":
      `Aims to ${d.type==="lose"?"lose":"gain"} ${fmtN(Math.abs(r)*100,2)}% of your weight a week — about ${fmtN(Math.abs(r)*d.kg,2)} kg.`+
      (d.type==="gain"?" Gaining faster than this mostly adds fat.":"");
    const meas=pl.burn==="measured";
    res.innerHTML=`<div class="tile"><span>You burn about</span><b>${kc(pl.tdee)}<small> kcal</small></b><small class="s">${meas?"measured":`${kc(pl.bmr)} at rest`}</small></div>
      <div class="tile"><span>Eat</span><b>${kc(pl.kcal)}<small> kcal</small></b><small class="s">a day</small></div>`;
    note.textContent=`Protein ${pl.protein} g · Carbs ${pl.carbs} g · Fat ${pl.fat} g. `+
      (pl.limited?`That is as low as it goes: below what you burn at rest it stops being sensible, so this ${paceText(pl.weekly)} rather than the pace asked for.`:
        `At ${kc(pl.kcal)} kcal a day this ${paceText(pl.weekly)}.`)+
      (meas?` Your burn is measured from ${pl.measured.days} days of your diary and weigh-ins, as chosen under Base targets on.`:
        " It is an estimate — your weight trend over the first few weeks shows the truth.");
    if(node.onValid)node.onValid(true);
  }
  node.valid=valid;node.value=value;node.refresh=upd;node.problem=problem;
  return node;
}
function saveProfile(v){
  const t=now();
  S.meta.profile=Object.assign({},v.profile,{t});
  S.meta.goal=Object.assign({},v.goal,{t});
  /* The weight typed here is a weigh-in, so the scale stays the one source. */
  const latest=weightOn(todayKey());
  if(!latest||Math.abs(latest-v.profile.kg)>=.05)setWeight(todayKey(),v.profile.kg);
  dirtyMeta();
}
function openProfileSheet(){
  let form,snap0;
  const root=sheet({title:"Profile and goal",left:"Cancel",right:"Save",tall:true,
    dirty:()=>JSON.stringify(form.value())!==snap0,onRight:()=>{
    if(!form.valid()){hud(form.problem()||"Fill in every field",WARN);return false}
    saveProfile(form.value());renderAll();hud("Saved");
  },build:(body,sh)=>{
    form=profileForm({profile:S.meta.profile,goal:S.meta.goal,kg:weightOn(todayKey())});
    form.onValid=ok=>sh.setRight("Save",ok);
    body.appendChild(form);
    formKeys(form,sh.submit);
  }});
  paintIn(root);form.refresh();
  snap0=JSON.stringify(form.value());
}
function openTargetsSheet(){
  const c=S.meta.custom||{};const p=plan(todayKey());

    const ins=root.body.querySelectorAll("input");

      <p class="foot">Leave a field empty to use the recommended value. Fat is then set to 30% of calories and carbs fill the rest. Changing your goal keeps a custom calorie target until you clear it here.</p>`;

const THEMES=[["auto","Automatic"],["light","Light"],["dark","Dark"]];
function applyTheme(){
  const t=S.meta.theme||"auto";
  if(t==="auto")delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme=t;
  /* The browser chrome follows theme-color, which only knows the system theme. */
  document.querySelectorAll("meta[name=theme-color]").forEach(m=>{if(!m.dataset.media)m.dataset.media=m.media;m.media=t==="auto"?m.dataset.media:((m.content==="#000000")===(t==="dark")?"all":"not all")});
}
const BACKUP_DUE_DAYS=30;
function daysSinceBackup(){return S.meta.backedUp?daysBetween(S.meta.backedUp,todayKey()):null}
/* Never backed up counts from the first logged day, so a new account is not
   nagged on day one — the server copy covers the start. */
function backupDue(){
  if(!hasData())return false;
  const d=daysSinceBackup();
  if(d!==null)return d>=BACKUP_DUE_DAYS;
  const first=Object.keys(S.days).filter(k=>entries(k).length).sort()[0];
  return !!first&&daysBetween(first,todayKey())>=BACKUP_DUE_DAYS;
}
function ago(d){return d===null?"Never":d===0?"Today":d===1?"Yesterday":`${d} days ago`}
function renderMe(){
  const p=plan(todayKey());
  if(!p){$("targetCard").innerHTML="";return}
  $("targetCard").innerHTML=[["Calories",`${kc(p.kcal)} kcal`],["Protein",`${p.protein} g`],["Carbs",`${p.carbs} g`],["Fat",`${p.fat} g`]]
    .map(([a,b])=>`<div class="cell"><span class="cl">${a}</span><span class="cv">${b}</span></div>`).join("");
  /* Says which burn the targets start from, and why when it is not the one
     chosen. */
  const mb=p.measured,held=p.burn==="measured"&&Math.round(p.tdee)!==Math.round(mb.kcal);
  const burnText=p.burn==="measured"?
    `You burn about ${kc(p.tdee)} kcal a day, measured from ${mb.days} days of your diary and weigh-ins`+
      (held?` (${kc(mb.kcal)}, held within a quarter of the formula’s ${kc(p.formula)})`:"")+". ":
    `You burn about ${kc(p.tdee)} kcal a day (${kc(p.bmr)} at rest), from the formula and ${fmtN(p.kg,1)} kg`+
      (mb&&mb.need?`, until there is enough to measure it: ${mb.need.toLowerCase()}`:"")+". ";
  $("targetFoot").textContent=burnText+
    `Eating ${kc(p.kcal)} ${paceText(p.weekly)}.`+(p.limited?" Your goal asked for a faster pace, but the target stops at what you burn at rest.":"")+
    (p.custom?" You have set a custom calorie target.":"");
  $("burnVal").textContent=S.meta.burn&&S.meta.burn.mode==="measured"?"Measured":"Formula";
  $("goalVal").textContent=goalText(S.meta.goal);
  const c=S.meta.custom||{};
  $("customVal").textContent=c.kcal||c.protein?"Custom":"Recommended";
  $("themeVal").textContent=(THEMES.find(t=>t[0]===(S.meta.theme||"auto"))||THEMES[0])[1];
  $("dataVal").textContent=!S.key?"Not joined":lastSyncOk===false?"Offline":"Synced";
  $("backupVal").textContent=ago(daysSinceBackup());
}

});
$("themeRow").addEventListener("click",e=>menu(e.currentTarget,THEMES.map(([k,label])=>({label,selected:(S.meta.theme||"auto")===k,
  onSelect:()=>{S.meta.theme=k;applyTheme();saveLocal();renderMe();allSegs().forEach(paintSeg)}}))));
$("dataRow").addEventListener("click",openDataSheet);
$("exportRow").addEventListener("click",exportBackup);

/* ==========================================================================
   Keeping the data: this phone, the server copy, and a backup file
   ========================================================================== */
async function askPersistence(){
  try{if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted()))await navigator.storage.persist()}catch(e){}
}
function backupFile(){
  const data={v:S.v,key:S.key,meta:S.meta,days:S.days,foods:S.foods};
  const payload={app:"calories",version:1,exported:new Date().toISOString(),data};
  return{name:`calories-backup-${todayKey()}.json`,blob:new Blob([JSON.stringify(payload)],{type:"application/json"})};
}
function markBackedUp(){S.meta.backedUp=todayKey();saveLocal();renderAll()}
/* Called straight from the tap, so the share sheet still counts as a gesture. */
function exportBackup(){
  const{name,blob}=backupFile();
  const file=new File([blob],name,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:"Calories backup"})
      .then(()=>{markBackedUp();hud("Backup saved")})
      .catch(e=>{if(!e||e.name!=="AbortError")saveViaLink(name,blob)});
    return;
  }
  saveViaLink(name,blob);
}
function saveViaLink(name,blob){
  const url=URL.createObjectURL(blob);
  const a=el("a");a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  markBackedUp();hud("Backup saved");
}
function importBackup(){
  const inp=el("input");inp.type="file";inp.accept="application/json,.json";
  inp.addEventListener("change",async()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    let parsed;
    try{parsed=JSON.parse(await f.text())}catch(e){return tellUser("Could not read that file","It is not a backup.")}
    const d=parsed&&parsed.app==="calories"&&parsed.data;
    if(!d||typeof d.days!=="object")return tellUser("Not a Calories backup","That file does not hold Calories data.");
    const nd=Object.keys(d.days||{}).length;
    if(!await confirmBox("Restore this backup?",`${nd} day${nd===1?"":"s"} will replace everything on this phone.`,"Replace"))return;
    const theme=S.meta.theme;
    S=normalize({v:1,key:d.key||S.key,meta:d.meta,days:d.days,foods:d.foods});
    S.meta.theme=theme||S.meta.theme;
    S.sync=syncBlank();markAllDirty();saveLocal();applyTheme();
    cur=todayKey();
    if(needsGate())showGate();else{hideGate();renderAll()}
    hud(`Restored ${nd} day${nd===1?"":"s"}`);
    if(S.key)syncNow();
  });
  inp.click();
}
const fmtBytes=b=>b==null?"Unknown":b<1024?b+" bytes":b<1048576?(b/1024).toFixed(1)+" KB":(b/1048576).toFixed(1)+" MB";
async function openDataSheet(){
  let persisted=null;
  try{if(navigator.storage&&navigator.storage.persisted)persisted=await navigator.storage.persisted()}catch(e){}
  sheet({title:"Data and sync",left:"",right:"Done",tall:true,build:(body,root)=>{
    /* Read afresh each time, so Sync now can redraw the rows in place. */
    const rowsHtml=()=>{
      let bytes=null;try{const raw=localStorage.getItem(LS);bytes=raw?new Blob([raw]).size:0}catch(e){}
      const last=S.sync.last?Math.round((Date.now()-new Date(S.sync.last))/60000):null;
      const pending=Object.keys(S.sync.dd).length+Object.keys(S.sync.df).length+(S.sync.dm?1:0);
      const rows=[
        ["Server copy",!S.key?"Not joined":lastSyncOk===false?"Offline":"On"],
        ["Last synced",last===null?"Never":last<1?"Just now":last<60?`${last} min ago`:last<1440?`${Math.round(last/60)} h ago`:`${Math.round(last/1440)} days ago`],
        ["Waiting to sync",pending?String(pending):"Nothing"],
        ["AI logging",aiText()],
        ["Kept on this phone",persisted===true?"Protected":persisted===false?"Best effort":"Unknown"],
        ["Opened from home screen",isInstalled()?"Yes":"No"],
        ["Size of your data",fmtBytes(bytes)],
        ["Last backup",ago(daysSinceBackup())]];
      return rows.map(([k,v])=>`<div class="cell${k==="AI logging"?" wrapv":""}"><span class="cl">${esc(k)}</span><span class="cv">${esc(v)}</span></div>`).join("");
    };
    const card=el("div","card");
    card.innerHTML=rowsHtml();
    body.appendChild(card);
    /* The AI row follows a status check made now; it never counts as use. */
    const redraw=()=>{if(card.isConnected)card.innerHTML=rowsHtml()};
    aiWatch.add(redraw);root.onClosed=()=>aiWatch.delete(redraw);
    if(S.key&&navigator.onLine!==false)aiStatus();
    if(isIOS()&&!isInstalled())body.appendChild(el("div","note",
      "<b>This is open in a browser tab, not the installed app.</b> On iPhone a tab’s storage can be cleared after about a week without a visit. "+
      "Open this page in <b>Safari</b>, tap Share, then <b>Add to Home Screen</b>, and use the icon. Your synced data follows."));
    const sync=el("button","btn","Sync now");
    let leave=null;
    /* The sheet stays open and its rows update. Only an unknown key, which
       has just put up the invite screen, closes it. */
    sync.onclick=async()=>{
      sync.disabled=true;if(leave)leave.disabled=true;sync.textContent="Syncing…";
      const ok=await syncNow();
      if(!S.key)root.close();
      else{sync.disabled=false;if(leave)leave.disabled=false;sync.textContent="Sync now";card.innerHTML=rowsHtml();renderAll()}
      hud(ok?"Synced":"Could not reach the server",ok?undefined:WARN);
    };
    if(S.key)body.appendChild(sync);
    const ex=el("button","btn ghost","Export backup");ex.onclick=()=>{exportBackup();root.close()};
    const im=el("button","btn ghost","Restore from a file");im.onclick=()=>{importBackup();root.close()};
    body.append(ex,im);
    if(S.key){
      body.appendChild(el("div","shdr",'<h2 class="t">Your key</h2>'));
      const kc_=el("div","card",`<div class="cell block"><code class="keyline">${esc(S.key)}</code></div>`);
      body.appendChild(kc_);
      body.appendChild(el("p","foot","This key is your account: there is no email or password. Paste it on a new phone to bring everything across. It is also inside every backup file. Anyone who has it can read and change your diary, and if it is lost along with every phone and backup, the synced copy cannot be recovered."));
      const copy=el("button","btn ghost","Copy the key");
      copy.onclick=()=>{
        if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(S.key).then(()=>hud("Copied"),()=>hud("Select it and copy",WARN));
        else hud("Select it and copy",WARN);
      };
      leave=el("button","btn danger","Delete my data from the server");
      leave.onclick=async()=>{
        if(!await confirmBox("Delete your server copy?","Your diary is removed from the server and your place in the group is freed. This phone keeps its copy, but the app stays locked until you join again with an invite code, so export a backup first.","Delete"))return;
        leave.disabled=sync.disabled=true;leave.textContent="Deleting…";
        try{await rpc("cal_leave",{p_key:S.key})}
        catch(e){leave.disabled=sync.disabled=false;leave.textContent="Delete my data from the server";return tellUser("Could not delete",friendly(e))}
        S.key=null;S.sync=syncBlank();saveLocal();root.close();setSync(null);showGate();hud("Server copy deleted");
      };
      body.append(copy,leave);
    }
  }});
}

/* ==========================================================================
   First run: join with the invite code, then the profile
   ========================================================================== */
const needsGate=()=>!S.key||!S.meta.profile;
const LOGO='<svg width="46" height="46" viewBox="0 0 46 46" fill="none"><circle cx="23" cy="23" r="16" stroke="rgba(255,255,255,.35)" stroke-width="6"/><path d="M23 7a16 16 0 1 1-15.2 11" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>';
function showGate(){
  document.body.classList.add("gated");$("gate").classList.remove("hidden");
  renderGate();
}
function hideGate(){
  document.body.classList.remove("gated");$("gate").classList.add("hidden");$("gate").innerHTML="";
  showTab(curTab||"diary");
}
function renderGate(){
  const g=$("gate");g.innerHTML="";
  if(!S.key){
    g.innerHTML=`<div class="hero"><div class="logo">${LOGO}</div><h1>Calories</h1>
      <p>Log what you eat against a daily target worked out for your body and your goal.</p></div>
      <div class="shdr"><h2 class="t">Invite code</h2></div>
      <div class="card"><label class="cell"><input class="cin left" id="inviteIn" placeholder="Enter your invite code" autocapitalize="characters" autocorrect="off" spellcheck="false" autocomplete="off" aria-label="Invite code"></label></div>
      <p class="foot err hidden" id="joinErr"></p>
      <button class="btn" id="joinBtn" type="button">Join</button>
      <button class="btn link" id="haveKey" type="button">Already joined on another phone?</button>
      <button class="btn link" id="restoreBk" type="button" style="margin-top:0">Restore from a backup file</button>`;
    const inp=$("inviteIn"),btn=$("joinBtn"),err=$("joinErr"),hk=$("haveKey"),rb=$("restoreBk");
    /* While a request is out, nothing else here can start one. */
    const busy=on=>[btn,inp,hk,rb].forEach(n=>n.disabled=on);
    const go=async()=>{
      const code=inp.value.trim();
      if(!code){hud("Enter your invite code",WARN);inp.focus();return}
      busy(true);btn.textContent="Joining…";err.classList.add("hidden");
      try{await join(code);haptic(20);if(needsGate())renderGate();else{hideGate();hud("Welcome back")}}
      catch(e){err.textContent=friendly(e);err.classList.remove("hidden");busy(false);btn.textContent="Join";announce(err.textContent);inp.focus()}
    };
    btn.onclick=go;
    /* The error is about the code that was sent, not the one being typed. */
    inp.addEventListener("input",()=>err.classList.add("hidden"));
    formKeys(g,go);
    hk.onclick=async()=>{
      const v=await promptText({title:"Your key",placeholder:"40 characters",right:"Use it",
        note:"Find it on your other phone under Me → Data and sync. Anything already on this phone is merged in.",
        check:x=>/^[0-9a-f]{40}$/i.test(x.trim())||"That is not a key"});
      if(!v)return;
      busy(true);hk.textContent="Checking the key…";err.classList.add("hidden");
      try{await useKey(v.trim().toLowerCase());if(needsGate())renderGate();else{hideGate();hud("Welcome back")}}
      catch(e){busy(false);hk.textContent="Already joined on another phone?";tellUser("Could not use that key",friendly(e))}
    };
    rb.onclick=importBackup;
    return;
  }
  const form=profileForm({profile:S.meta.profile,goal:S.meta.goal,kg:weightOn(todayKey())});
  g.innerHTML=`<h2 class="gh">Profile and goal</h2><p class="gp">This works out what you burn and how much to eat for your goal. You can change any of it later.</p>`;
  g.appendChild(form);
  const start=el("button","btn","Start");start.type="button";start.disabled=true;
  form.onValid=ok=>{start.disabled=!ok};
  start.onclick=()=>{
    if(!form.valid())return;
    saveProfile(form.value());haptic(20);hideGate();hud("All set");
  };
  g.appendChild(start);
  formKeys(form,()=>start.click());
  paintIn(g);form.refresh();
}

/* ==========================================================================
   Tabs + chrome
   ========================================================================== */
const TITLES={diary:"Diary",foods:"Foods",progress:"Progress",me:"Me"};
let curTab="diary";
const tabY={};
function showTab(t){
  if(!TITLES[t])t="diary";
  const same=t===curTab;tabY[curTab]=scrollY;
  curTab=t;
  for(const k in TITLES)$("v-"+k).classList.toggle("hidden",k!==t);
  document.querySelectorAll(".tabbar button").forEach(b=>{
    if(b.dataset.tab===t)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
  });
  try{history.replaceState(null,"","#"+t)}catch(e){}
  closeRow();renderAll();scrollTo(0,same?0:(tabY[t]||0));syncNav();
}
document.querySelectorAll(".tabbar button").forEach(b=>b.addEventListener("click",()=>{haptic();showTab(b.dataset.tab)}));
function renderAll(){
  if(document.body.classList.contains("gated"))return;
  const title=curTab==="diary"?dayTitle():TITLES[curTab];
  $("title").textContent=$("navTitle").textContent=title;
  if(curTab==="diary")renderDiary();
  if(curTab==="foods")renderFoods();
  if(curTab==="progress")renderProgress();
  if(curTab==="me")renderMe();
  allSegs().forEach(paintSeg);
  /* The badge is part of the tab's name. */
  const due=backupDue();$("meTab").classList.toggle("due",due);$("meDue").textContent=due?", backup due":"";
}
function syncNav(){
  const bar=$("navbar"),t=$("title").getBoundingClientRect();
  const edge=bar.getBoundingClientRect().bottom;
  const span=t.height||1,left=t.bottom-edge;
  bar.classList.toggle("material",t.top<edge-1);
  bar.classList.toggle("titled",left<=span*.45);
  $("big").style.opacity=String(clampNum(left/span,0,1));
}
addEventListener("scroll",syncNav,{passive:true});
addEventListener("resize",syncNav);
/* A rotation redraws the charts at the new width. Only a width change: iOS
   resizes the height as its toolbars come and go. */
let progW=innerWidth;
addEventListener("resize",()=>{if(innerWidth!==progW){progW=innerWidth;if(curTab==="progress")renderProgress()}});

$("prevDay").addEventListener("click",()=>{haptic();cur=shiftKey(cur,-1);renderAll()});
$("nextDay").addEventListener("click",()=>{if(cur>=todayKey())return;haptic();cur=shiftKey(cur,1);renderAll()});
$("dateBtn").addEventListener("click",async()=>{const k=await pickDate({value:cur,title:"Jump to a day"});if(k){cur=k;renderAll()}});
$("weightRow").addEventListener("click",()=>openWeight(cur));
$("nutriRow").addEventListener("click",()=>openNutrition(cur));

/* The day can tick over while the app sits open; the other phone may have
   changed things too. */
let seenDay=todayKey();
/* On document, where the browser fires it. */
document.addEventListener("visibilitychange",()=>{
  if(document.hidden)return;
  if(todayKey()!==seenDay){if(cur===seenDay)cur=todayKey();seenDay=todayKey()}
  renderAll();
  if(S.key)syncNow();
  /* An installed app resumes for days without relaunching: AI that was off
     (or used up) is asked again, so a key added since takes effect. The
     check is free, and the sync above goes out on every return anyway. */
  if(S.key&&navigator.onLine!==false&&(aiState!=="on"||aiSpent()))aiStatus();
});
addEventListener("online",()=>{if(S.key)syncNow()});

if("serviceWorker" in navigator&&location.protocol!=="file:"){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{scope:"./",updateViaCache:"none"}).catch(()=>{}));
}

applyTheme();
if(needsGate())showGate();
else showTab((location.hash||"").slice(1)||"diary");
if(S.key)syncNow();
askPersistence();
addEventListener("pointerdown",function once(){removeEventListener("pointerdown",once);askPersistence()},{passive:true});
/* Warm the food database once the app is idle, so the first search is instant. */
setTimeout(()=>loadUSDA().catch(()=>{}),2500);
</script>
