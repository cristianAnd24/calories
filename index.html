<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calories">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<title>Calories</title>
<style>
/* ==========================================================================
   Design tokens — Apple system colours (see ../apple-design.md)
   ========================================================================== */
:root{
  --bg:#f2f2f7; --card:#ffffff; --sheet:#f2f2f7; --raised:#ffffff;
  --glass:rgba(249,249,249,.72); --bar:rgba(249,249,249,.82);
  --f1:rgba(120,120,128,.2); --f2:rgba(120,120,128,.16);
  --f3:rgba(118,118,128,.12); --f4:rgba(116,116,128,.08);
  --lab:#000000; --lab2:rgba(60,60,67,.6); --lab3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29);
  --tint:#007aff; --tint-weak:rgba(0,122,255,.12); --on-tint:#ffffff;
  --red:#ff3b30; --green:#34c759; --orange:#ff9500; --yellow:#ffcc00;
  /* Apple's Increase Contrast red and green, for anything read as text. The
     plain ones stay for fills, rings and bars. */
  --red-text:#d70015; --green-text:#248a3d; --alert:rgba(249,249,249,.9); --tab-off:#8e8e93;
  --pink:#ff2d55; --teal:#30b0c7; --indigo:#5856d6; --purple:#af52de;
  --gold-weak:rgba(255,149,0,.12);
  /* macros: protein, carbs, fat */
  --pro:#ff2d55; --carb:#30b0c7; --fat:#ff9500;
  --pop:0 10px 34px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.1);
  --lift:0 -14px 50px rgba(0,0,0,.18);
  --thumb:#ffffff; --thumb-sh:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI Variable Text","Segoe UI",sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.2,.9,.25,1.12);
  color-scheme:light; box-sizing:border-box;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1c1c1e; --sheet:#1c1c1e; --raised:#2c2c2e;
  --glass:rgba(44,44,46,.74); --bar:rgba(22,22,24,.82);
  --f1:rgba(120,120,128,.36); --f2:rgba(120,120,128,.32);
  --f3:rgba(118,118,128,.24); --f4:rgba(116,116,128,.18);
  --lab:#ffffff; --lab2:rgba(235,235,245,.6); --lab3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65);
  --tint:#0a84ff; --tint-weak:rgba(10,132,255,.22); --on-tint:#ffffff;
  --red:#ff453a; --green:#30d158; --orange:#ff9f0a; --yellow:#ffd60a;
  --red-text:#ff453a; --green-text:#30d158; --alert:rgba(44,44,46,.74);
  --pink:#ff375f; --teal:#40cbe0; --indigo:#5e5ce6; --purple:#bf5af2;
  --gold-weak:rgba(255,159,10,.18);
  --pro:#ff375f; --carb:#40cbe0; --fat:#ff9f0a;
  --thumb:#636366; --thumb-sh:0 3px 8px rgba(0,0,0,.3);
  --pop:0 10px 34px rgba(0,0,0,.5); --lift:0 -14px 50px rgba(0,0,0,.6);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --sheet:#1c1c1e; --raised:#2c2c2e;
  --glass:rgba(44,44,46,.74); --bar:rgba(22,22,24,.82);
  --f1:rgba(120,120,128,.36); --f2:rgba(120,120,128,.32);
  --f3:rgba(118,118,128,.24); --f4:rgba(116,116,128,.18);
  --lab:#ffffff; --lab2:rgba(235,235,245,.6); --lab3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65);
  --tint:#0a84ff; --tint-weak:rgba(10,132,255,.22); --on-tint:#ffffff;
  --red:#ff453a; --green:#30d158; --orange:#ff9f0a; --yellow:#ffd60a;
  --red-text:#ff453a; --green-text:#30d158; --alert:rgba(44,44,46,.74);
  --pink:#ff375f; --teal:#40cbe0; --indigo:#5e5ce6; --purple:#bf5af2;
  --gold-weak:rgba(255,159,10,.18);
  --pro:#ff375f; --carb:#40cbe0; --fat:#ff9f0a;
  --thumb:#636366; --thumb-sh:0 3px 8px rgba(0,0,0,.3);
  --pop:0 10px 34px rgba(0,0,0,.5); --lift:0 -14px 50px rgba(0,0,0,.6);
  color-scheme:dark;}
/* Increase Contrast. Plain :root, so the dark blocks above still win there. */
@media (prefers-contrast:more){:root{--lab2:rgba(60,60,67,.76);--tint:#0040dd;--tint-weak:rgba(0,64,221,.12)}}

/* ==========================================================================
   Base
   ========================================================================== */
*,*::before,*::after{box-sizing:inherit}
html{height:100%;-webkit-text-size-adjust:100%;
  scrollbar-width:thin;scrollbar-color:var(--f1) transparent}
/* Only where a scrollbar takes up layout; touch platforms overlay theirs. */
@media (pointer:fine){html{scrollbar-gutter:stable}}
body{margin:0;min-height:100%;background:var(--bg);color:var(--lab);
  font:400 17px/1.29 var(--sans);letter-spacing:-.026em;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
/* Two quick taps on a control would otherwise zoom the page on iOS. The finger
   lands on the icon inside a button, so the descendants need it too, and the
   containers are covered as a backstop. WebKit resets the used value at every
   overflow:auto or overflow:scroll element, so each scroller is named too.
   Narrower values (pan-y on swipe rows, none on sheet handles) still win.
   See ../CLAUDE.md, "Fix once". */
button,input,select,textarea,a,label,[role="button"],
button *,label *,a *,
main,#ui,#gate,.sheet-body,.menu,.wheel,.wheel *{touch-action:manipulation}
button{cursor:pointer;-webkit-appearance:none;appearance:none;border:0;background:none;padding:0}
input{-webkit-appearance:none;appearance:none;border-radius:0}
:focus{outline:none}
:focus-visible{outline:2.5px solid var(--tint);outline-offset:2px}
/* A focused text field shows only the caret, as UITextField does. */
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none}
/* Rows flush inside a clipping container draw the ring inward. */
.alert :focus-visible,.menu :focus-visible,.card .cell:focus-visible,.card .fr:focus-visible,.card .surah:focus-visible,.pm button:focus-visible{outline-offset:-3px}
.alert:focus,.alert:focus-visible{outline:none}
.sheet:focus,.menu:focus{outline:none}
input[type=search]::-webkit-search-cancel-button,
input[type=search]::-webkit-search-decoration{-webkit-appearance:none;display:none}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ==========================================================================
   Navigation bar + large title
   ========================================================================== */
.navbar{position:fixed;top:0;left:0;right:0;z-index:40;padding-top:env(safe-area-inset-top,0px);
  -webkit-backdrop-filter:blur(0px) saturate(100%);backdrop-filter:blur(0px) saturate(100%);
  background:transparent;
  transition:background .24s linear,-webkit-backdrop-filter .24s linear,backdrop-filter .24s linear}
.navbar.material{background:var(--bar);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}
.navbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.5px;
  background:var(--sep);opacity:0;transition:opacity .24s linear}
.navbar.material::after{opacity:1}
.navbar .in{position:relative;height:44px;max-width:560px;margin:0 auto;padding:0 10px;
  display:flex;align-items:center;justify-content:center}
.navbar .nt{font-size:17px;font-weight:600;letter-spacing:-.026em;
  opacity:0;transform:translateY(7px);transition:opacity .2s ease,transform .2s ease}
.navbar.titled .nt{opacity:1;transform:none}

main{max-width:560px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 52px) 16px calc(env(safe-area-inset-bottom,0px) + 112px)}
.big{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 4px 16px}
.big h1{font-size:34px;line-height:1.2;font-weight:700;letter-spacing:.011em;margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",var(--sans);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sync{font-size:13px;letter-spacing:-.006em;color:var(--lab2);padding-bottom:7px;display:flex;align-items:center;gap:5px;flex:none}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--lab3)}

/* ==========================================================================
   Grouped list
   ========================================================================== */
.shdr{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
  margin:26px 20px 7px;font-size:13px;line-height:1.3;letter-spacing:-.006em;min-height:17px}
.shdr .t{color:var(--lab2);text-transform:uppercase;letter-spacing:.045em}
.shdr h2{margin:0;font:inherit}
.shdr .x{color:var(--lab2);font-variant-numeric:tabular-nums;white-space:nowrap}
.shdr button.x{display:flex;align-items:center;gap:6px;color:var(--lab2);margin:-16px -12px -6px 0;padding:16px 12px 6px}
.shdr button.x .dots{color:var(--tint)}
.shdr button.x:active{opacity:.4}
.foot{font-size:13px;line-height:1.38;letter-spacing:-.006em;color:var(--lab2);margin:7px 20px 0}
.note{font-size:13px;line-height:1.42;letter-spacing:-.006em;color:var(--lab);background:var(--gold-weak);
  border-radius:10px;padding:12px 14px;margin:12px 0 0}
.note b{font-weight:600}
.err{color:var(--red-text)}
.card{background:var(--card);border-radius:12px;overflow:hidden}
.sheet .card,.sheet .tile{background:var(--raised)}
.cell{display:flex;align-items:center;gap:12px;min-height:46px;padding:9px 16px;
  position:relative;width:100%;text-align:left}
.cell+.cell::before,.cell+.sw::before,.sw+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;
  border-top:.5px solid var(--sep);z-index:2}
.cell.block{display:block}
/* Under heavy page zoom a row stacks rather than crushing its field to 0. */
@media (max-width:300px){.cell{flex-wrap:wrap}.shdr{flex-wrap:wrap}.shdr button.x{margin-left:auto}}
.cl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv{color:var(--lab2);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
/* As in an iOS value1 cell, the detail gives way before the label does. */
#v-me .cl{flex:1 0 auto}
#v-me .cv{min-width:0;overflow:hidden;text-overflow:ellipsis}
.keyline{display:block;width:100%;color:var(--lab2);word-break:break-all;
  font:500 13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;
  -webkit-user-select:all;user-select:all}
.sub{font-size:15px;letter-spacing:-.016em;color:var(--lab2)}
button.cell:active,.tap:active{background:var(--f4)}
.chev{color:var(--lab3);margin-right:-2px}
.empty{color:var(--lab2);padding:14px 16px;margin:0;font-size:15px;letter-spacing:-.016em}
.tintc{color:var(--tint)}
.addrow{color:var(--tint);gap:10px}
.addrow svg{color:var(--tint)}
.cin{flex:1;min-width:3em;border:0;background:none;text-align:right;font-size:17px;letter-spacing:-.026em;
  color:var(--lab);font-variant-numeric:tabular-nums;padding:0}
.cin::placeholder{color:var(--lab3)}
.cin.left{text-align:left}
/* Read-only values in the secondary colour. opacity:1 undoes iOS's own
   faded disabled field, which in dark is dimmer than its unit. */
.cin:disabled{color:var(--lab2);-webkit-text-fill-color:var(--lab2);opacity:1}
/* Wide enough for "years", so the values in a card end on one edge. No
   tracking of its own: it inherits the value's. */
.unit{color:var(--lab2);font-size:17px;flex:none;text-align:left;min-width:2.6em}

/* ==========================================================================
   Date navigator
   ========================================================================== */
.datenav{display:flex;align-items:center;gap:4px;padding:5px 6px}
.arrow{width:46px;height:46px;border-radius:50%;color:var(--tint);
  display:flex;align-items:center;justify-content:center;transition:background .15s,opacity .15s}
.arrow:active:not(:disabled){background:var(--f4)}
.arrow:disabled{color:var(--lab3)}
.dlabel{flex:1;min-width:0;align-self:stretch;text-align:center;border-radius:10px;padding:8px 4px;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.dlabel:active{background:var(--f4)}
.dlabel span{font-size:17px;font-weight:600;letter-spacing:-.026em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlabel svg{color:var(--tint)}

/* ==========================================================================
   Day summary: ring + macros
   ========================================================================== */
.sum{display:flex;flex-wrap:wrap;align-items:center;gap:18px;padding:16px 16px 6px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring .trk{stroke:var(--f3)}
.ring .val{stroke:var(--green);transition:stroke-dashoffset .6s var(--ease),stroke .2s}
.ring.over .val{stroke:var(--red)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .mid b{font-size:22px;font-weight:700;letter-spacing:-.012em;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.ring .mid span{font-size:12px;color:var(--lab2);letter-spacing:0}
.sum-r{flex:1;min-width:110px;display:grid;gap:9px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:15px;letter-spacing:-.016em}
.kv span{color:var(--lab2)}
.kv b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.macros{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:12px;padding:10px 16px 16px}
.mac{min-width:0}
.mac .ml{display:flex;justify-content:space-between;gap:4px;font-size:13px;letter-spacing:-.006em;color:var(--lab2)}
.mac .mv{font-size:15px;font-weight:600;letter-spacing:-.016em;font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:6px}
.mac .mv small{font-size:13px;font-weight:400;color:var(--lab2);letter-spacing:-.006em}
.bar{height:6px;border-radius:3px;background:var(--f3);overflow:hidden;margin-top:5px}
.bar span{display:block;height:100%;border-radius:3px;transition:width .5s var(--ease)}
.bar.over span{opacity:.55}

/* ==========================================================================
   Food rows
   ========================================================================== */
.fr{display:flex;align-items:center;gap:12px;min-height:56px;padding:9px 16px;width:100%;text-align:left;position:relative}
button.fr:active{background:var(--f4)}
.fr+.fr::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.ft{flex:1;min-width:0}
.fn{display:block;font-size:17px;letter-spacing:-.026em;line-height:1.25;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.fs{display:block;font-size:13px;letter-spacing:-.006em;color:var(--lab2);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fk{flex:none;font-size:17px;letter-spacing:-.026em;font-variant-numeric:tabular-nums;color:var(--lab);text-align:right;white-space:nowrap}
.fk small{display:block;font-size:12px;color:var(--lab2);letter-spacing:0}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.02em;padding:1px 5px;border-radius:4px;
  background:var(--f3);color:var(--lab2);margin-right:5px;vertical-align:1px}
.tag.me{background:var(--tint-weak);color:var(--tint)}

/* ==========================================================================
   Segmented control
   ========================================================================== */
.seg{position:relative;display:flex;background:var(--f3);border-radius:9px;padding:2px;
  width:100%;isolation:isolate}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:0;border-radius:7px;
  background:var(--thumb);box-shadow:var(--thumb-sh);z-index:0;opacity:0;
  transition:transform .26s var(--spring),width .26s var(--spring),opacity .16s,background .2s}
.seg.on .thumb{opacity:1}
.seg button{position:relative;z-index:1;flex:1;min-width:0;border-radius:7px;padding:6px 3px;
  font-size:13px;font-weight:500;letter-spacing:-.006em;color:var(--lab);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s,transform .12s}
.seg button:active{transform:scale(.95)}
/* The divider sits inside its own button, so overflow:hidden cannot clip it. */
.seg button::after{content:"";position:absolute;left:0;top:5px;bottom:5px;width:1px;
  background:var(--sep);opacity:0;transition:opacity .2s}
.seg button:not(:first-of-type)::after{opacity:1}
.seg button[aria-pressed="true"]::after,
.seg button[aria-pressed="true"]+button::after{opacity:0}
.seg button[aria-pressed="true"]{font-weight:600}
.segwrap{padding:10px 16px}

/* ==========================================================================
   Tiles, charts
   ========================================================================== */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:12px;padding:12px 14px;min-width:0}
.tile span{display:block;font-size:13px;letter-spacing:-.006em;color:var(--lab2);margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile b{font-size:22px;font-weight:600;letter-spacing:-.012em;font-variant-numeric:tabular-nums;
  display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile b small{font-size:15px;font-weight:500;color:var(--lab2);letter-spacing:-.016em}
.tile small.s{display:block;font-size:13px;letter-spacing:-.006em;color:var(--lab2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{padding:14px 12px 10px}
.chart svg{width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--sep);stroke-width:.5}
.chart .ax{fill:var(--lab2);font-size:11px;letter-spacing:.006em;font-family:var(--sans)}
.chart .tl{stroke:var(--tint);stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--card);stroke:var(--tint);stroke-width:1.6}
.chart .bq{fill:var(--green)}
.chart .bq.o{fill:var(--red)}
.chart .tg{stroke:var(--lab2);stroke-width:1.2;stroke-dasharray:4 4}
.chart-cap{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px 0}
.chart-cap b{font-size:22px;font-weight:600;letter-spacing:-.012em;font-variant-numeric:tabular-nums;white-space:nowrap}
.chart-cap span{font-size:13px;letter-spacing:-.006em;color:var(--lab2);text-align:right}
.legend{display:flex;gap:14px;padding:0 16px 12px;font-size:12px;letter-spacing:0;color:var(--lab2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ==========================================================================
   Search field
   ========================================================================== */
.search{position:relative;display:flex;align-items:center;gap:7px;height:36px;
  background:var(--f3);border-radius:10px;padding:0 9px;color:var(--lab2)}
.search input{flex:1;min-width:0;border:0;background:none;font-size:17px;letter-spacing:-.026em;height:100%;padding:0}
.search input::placeholder{color:var(--lab2)}
.search .clr{width:36px;height:36px;margin-right:-7px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:var(--lab2);flex:none}

/* ==========================================================================
   Buttons
   ========================================================================== */
.btn{display:block;width:100%;border-radius:12px;background:var(--tint);color:var(--on-tint);
  font-size:17px;font-weight:600;letter-spacing:-.026em;padding:15px;margin-top:14px;
  transition:transform .12s,opacity .12s;text-align:center}
.btn:active:not(:disabled){transform:scale(.98);opacity:.85}
.btn:disabled{background:var(--f3);color:var(--lab3);cursor:default}
.btn.ghost{background:var(--f3);color:var(--tint);margin-top:9px}
.btn.danger{background:var(--f3);color:var(--red-text);margin-top:9px}
.btn.link{background:none;color:var(--tint);font-weight:400;padding:12px;margin-top:4px}
.btn.link:disabled{color:var(--lab3)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 2px}
.acts.two{grid-template-columns:1fr 1fr}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 4px 10px;border-radius:12px;
  background:var(--raised);color:var(--tint);font-size:13px;font-weight:500;letter-spacing:-.006em;
  transition:transform .12s,background .12s}
.act:active{transform:scale(.96);background:var(--f3)}
.act span{color:var(--lab)}

/* ==========================================================================
   Swipe-to-delete rows
   ========================================================================== */
.sw{position:relative;overflow:hidden;touch-action:pan-y}
.sw+.sw::before{content:"";position:absolute;top:0;left:16px;right:0;z-index:2;
  border-top:.5px solid var(--sep)}
/* Hidden until a swipe starts: a row of fractional height lets the red edge
   bleed past the row covering it otherwise. */
.sw-act{position:absolute;top:0;right:0;bottom:0;width:96px;background:var(--red);color:#fff;
  font-size:15px;font-weight:500;letter-spacing:-.016em;display:flex;align-items:center;justify-content:center;visibility:hidden}

/* ==========================================================================

   ========================================================================== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bar);

@media (orientation:landscape) and (max-height:500px){.big{display:none}.tabbar button{flex-direction:row;justify-content:center;gap:6px;padding:4px 0}.tabbar svg{width:22px;height:22px;order:-2}.tabbar button.due::after{position:static;flex:none;order:-1;align-self:flex-start;margin:-2px -3px 0 -11px}main{padding-top:calc(env(safe-area-inset-top,0px) + 56px)}}

/* ==========================================================================
   First run
   ========================================================================== */
body.gated .navbar,body.gated main,body.gated .tabbar{display:none}
#gate{max-width:560px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 40px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}

.result{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

/* ==========================================================================
   Overlays — shared (from Habits)
   ========================================================================== */
.ov{position:fixed;inset:0;z-index:60;display:flex}

.alert-ov{align-items:center;justify-content:center;padding:20px}

.alert-head{padding:19px 16px 15px}

/* Sheets. A tall sheet keeps its bar fixed and scrolls its body. */
.sheet-ov{align-items:flex-end;justify-content:center}
.sheet{position:relative;width:100%;max-width:560px;background:var(--sheet);

.grab{width:36px;height:5px;border-radius:3px;background:var(--f1);margin:0 auto}

.sheet-bar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.5px;

.unitbtn{display:flex;align-items:center;justify-content:flex-end;gap:4px;color:var(--tint);flex:0 1 auto;
  min-width:44px;max-width:58%;padding:11px 0 11px 6px;margin:-5px 0}
.unitbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.amt .cin{min-width:72px}

.nt-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 16px;position:relative}
.nt-row+.nt-row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.nt-row .bar{grid-column:1/-1;margin-top:3px;height:4px}

.cam{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .guide{position:absolute;left:12%;right:12%;top:30%;bottom:30%;border-radius:12px;

.hud{position:fixed;left:50%;top:50%;z-index:80;transform:translate(-50%,-50%) scale(.9);

.cal-nav button{width:42px;height:42px;border-radius:50%;color:var(--tint);

.cal-nav button:active:not(:disabled){background:var(--f4)}

.cal-grid.slide-l{animation:sl .26s var(--ease)}

@keyframes sl{from{opacity:.2;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes sr{from{opacity:.2;transform:translateX(-16px)}to{opacity:1;transform:none}}
/* At most 44px wide, so the selection stays a circle on wide phones. */
.cal-grid>*{position:relative;width:min(100%,44px);aspect-ratio:1;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:400;

.cal-grid button:not(:disabled):active{transform:scale(.86)}
.cal-grid em{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--green)}

.cal-wheels{display:none;grid-template-columns:1.4fr 1fr;position:relative;align-items:center}
.cal.picking .cal-wheels{display:grid}
.cal.picking .cal-dow,.cal.picking .cal-grid{display:none}

.wheels{position:relative}

/* Latest weigh-in on or before a day. The profile weight only stands in until
   the first one, so the targets follow the scale rather than a number typed

function weightOn(k){
  let bk=null,kg=null;
  for(const d in S.days){
    if(k&&d>k)continue;

function plan(k,draft,{noCustom}={}){
  const p=draft?draft.profile:S.meta.profile;if(!p)return null;
  const g=draft?draft.goal:S.meta.goal, c=draft||noCustom?{}:S.meta.custom||{};
  const kg=(draft?p.kg:weightOn(k))||p.kg;
  const age=new Date().getFullYear()-p.by;
  const bmr=10*kg+6.25*p.cm-5*age+(p.sex==="f"?-161:5);
  const tdee=bmr*p.act;

     at rest. Stop there and say what pace that really gives. */

/* Portion labels look like "1 cup, chopped", "1/3 cup" or "3 oz". Only a
   label carrying a plural count is multiplied out (2 of "3 oz" read "6 oz");

  const m=/^(\d+(?:[.,]\d+)?|\d+\/\d+)\s+(.+)$/.exec(label||"");
  if(!m)return{num:1,unit:label||"",bare:true};
  const v=m[1].includes("/")?m[1].split("/").reduce((a,b)=>a/b):parseFloat(m[1].replace(",","."));

    for(const id in df)if(S.sync.df[id]===df[id])delete S.sync.df[id];
    /* Overlap the next pull by two minutes: a write that started before this
       pull but committed after it carries an earlier timestamp. Pulling a
       record twice is harmless — merging is idempotent. */
    if(r&&r.now)S.sync.at=new Date(new Date(r.now).getTime()-120000).toISOString();
    S.sync.last=new Date().toISOString();
    saveLocal();setSync("on");lastSyncOk=true;
    if(changed)renderAll();
  }catch(e){
    ok=false;lastSyncOk=false;setSync("off");
    if(/unknown key/.test(e.message)){
      /* The server no longer knows this phone (left the group, or the row was
         removed). Keep the data; ask to join again. */
      S.key=null;saveLocal();showGate();
    }
  }finally{
    syncing=false;
    if(syncAgain){syncAgain=false;setTimeout(syncNow,300)}
  }
  return ok;
}
/* Everything local goes up on the next sync: after joining with data already
   here, or restoring a backup. */
function markAllDirty(){
  for(const k in S.days)S.sync.dd[k]=(S.sync.dd[k]||0)+1;
  S.sync.dm=(S.sync.dm||0)+1;
  for(const id in S.foods)if(S.foods[id].mine)S.sync.df[id]=(S.sync.df[id]||0)+1;
}
const friendly=e=>{
  const m=(e&&e.message)||"";
  if(e&&e.offline)return "Could not reach the server. Check the connection and try again.";
  if(/invite not recognised/.test(m))return "That invite code is not right.";
  if(/used up|app is full/.test(m))return "The group is full — there are no places left.";
  if(/unknown key/.test(m))return "No one has joined with that key.";
  if(/function|schema cache/i.test(m))return "The server is not set up yet.";
  return m||"Something went wrong.";
};
async function join(code){
  const key=S.key||newKey();
  await rpc("cal_join",{p_code:code,p_key:key});
  S.key=key;S.sync=syncBlank();markAllDirty();saveLocal();
  await syncNow();
}
async function useKey(key){
  const r=await rpc("cal_pull",{p_key:key,p_since:null});
  S.key=key;S.sync=syncBlank();markAllDirty();applyPull(r);saveLocal();
  await syncNow();

const UI=$("ui");
let locks=0;
function lock(on){locks=Math.max(0,locks+(on?1:-1));document.body.classList.toggle("locked",locks>0)}
function overlay(cls){
  const root=el("div","ov "+cls);
  /* Modal for a keyboard and VoiceOver: the page behind goes inert, Escape
     goes through the top overlay's backdrop, and focus returns afterwards. */
  const ret=document.activeElement&&document.activeElement.matches("button:focus-visible")?document.activeElement:null;
  const bg=document.querySelectorAll("body>.navbar,body>main,body>.tabbar,#gate");
  bg.forEach(n=>n.inert=true);
  const onKey=e=>{if(e.key==="Escape"&&[...UI.querySelectorAll(".ov.in")].pop()===root){e.preventDefault();root.querySelector(".ov-back").click()}};
  addEventListener("keydown",onKey);
  UI.appendChild(root);lock(true);
  let closed=false;
  /* Reflow, then flip the class: a real transition that does not need rAF,
     which never fires in a background tab. */
  root.show=()=>{void root.offsetWidth;root.classList.add("in")};
  root.close=()=>{
    if(closed)return;closed=true;
    root.classList.remove("in");root.classList.add("out");lock(false);
    removeEventListener("keydown",onKey);
    if(!UI.querySelector(".ov.in"))bg.forEach(n=>n.inert=false);
    if(ret&&ret.isConnected)ret.focus({preventScroll:true});
    if(root.onClosed)try{root.onClosed()}catch(e){}
    setTimeout(()=>root.remove(),460);
  };
  return root;
}
function alertBox({title,message,actions}){

    box.setAttribute("role","alertdialog");box.setAttribute("aria-modal","true");box.tabIndex=-1;
    const aid="al"+Math.random().toString(36).slice(2);
    box.appendChild(el("div","alert-head",(title?`<b id="${aid}t">${esc(title)}</b>`:"")+(message?`<p id="${aid}m">${esc(message)}</p>`:"")));
    if(title)box.setAttribute("aria-labelledby",aid+"t");
    if(message)box.setAttribute("aria-describedby",aid+"m");
    const acts=el("div","alert-acts"+(actions.length>2?" stack":""));

    if(it.title){m.appendChild(el("div","menu-title",esc(it.title)));return}

/* Bottom sheet, drag the bar down to dismiss. onRight returning false keeps it
   open, so a form can refuse. An empty left or right hides that button.
   dirty() says whether Cancel, the backdrop or a drag would lose edits; if so
   it asks first. Saving never asks. */
function sheet({title,left="Cancel",right,onRight,build,tall,dirty}){
  const root=overlay("sheet-ov");
  const back=el("div","ov-back");
  const s=el("div","sheet"+(tall?" tall":""));
  const zone=el("div","grab-zone",'<div class="grab"></div>');
  const bar=el("div","sheet-bar");
  const lb=el("button","l",esc(left||""));
  if(!left)lb.style.visibility="hidden";
  const tt=el("h2",null,esc(title||""));
  tt.id="sh"+Math.random().toString(36).slice(2);
  s.setAttribute("role","dialog");s.setAttribute("aria-modal","true");s.setAttribute("aria-labelledby",tt.id);s.tabIndex=-1;
  const rb=el("button","r",esc(right||""));
  /* A successful save takes the keyboard down with the sheet. */
  rb.onclick=()=>{if(onRight&&onRight()===false)return;if(s.contains(document.activeElement))document.activeElement.blur();root.close()};
  if(!right)rb.style.visibility="hidden";
  bar.append(lb,tt,rb);
  const body=el("div","sheet-body");
  body.addEventListener("scroll",()=>bar.classList.toggle("edge",body.scrollTop>0),{passive:true});
  s.append(zone,bar,body);
  root.append(back,s);
  const tryClose=()=>{
    s.style.transform="";
    let d=false;try{d=!!(dirty&&dirty())}catch(e){}
    if(d){alertBox({title:"Discard changes?",actions:[{label:"Keep Editing",style:"cancel",value:false},
      {label:"Discard",style:"destructive",value:true}]}).then(v=>{if(v===true)root.close()});return}
    root.close();
  };
  lb.onclick=tryClose;back.onclick=tryClose;
  root.setTitle=t=>{tt.textContent=t};
  root.setLeft=t=>{lb.textContent=t;lb.style.visibility=t?"":"hidden"};
  root.setRight=(t,enabled=true)=>{rb.textContent=t;rb.style.visibility=t?"":"hidden";rb.disabled=!enabled};
  /* Return in a form's last field: the same as tapping the trailing button. */
  root.submit=()=>{if(rb.style.visibility!=="hidden"&&!rb.disabled)rb.click()};
  root.body=body;
  /* A sheet that throws while building must still appear, or its invisible
     backdrop sits over the app and swallows every tap. */
  try{build(body,root)}catch(e){console.error(e);body.appendChild(el("p","foot err","Something went wrong here."))}
  root.show();if(!s.contains(document.activeElement))s.focus({preventScroll:true});

  let y0=0,dy=0,dragging=false;
  const down=e=>{
    if(e.target.closest("button"))return;
    dragging=true;y0=e.clientY;dy=0;
    s.style.transition="none";
    try{zone.setPointerCapture(e.pointerId)}catch(err){}
  };
  const move=e=>{
    if(!dragging)return;
    dy=Math.max(0,e.clientY-y0);
    s.style.transform=`translateY(${dy}px)`;
    back.style.opacity=String(Math.max(0,1-dy/420));
  };
  const up=()=>{
    if(!dragging)return;dragging=false;
    s.style.transition="";back.style.opacity="";
    if(dy>96)tryClose();else s.style.transform="";
  };
  [zone,bar].forEach(n=>n.addEventListener("pointerdown",down));
  zone.addEventListener("pointermove",move);
  zone.addEventListener("pointerup",up);
  zone.addEventListener("pointercancel",up);
  return root;
}

/* --- Wheel picker column (UIPickerView, from Habits) --- */
const ROW=36;
function wheel(values,index,onChange){
  const w=el("div","wheel");
  w.innerHTML=values.map(v=>`<i>${esc(v)}</i>`).join("");
  const items=[...w.children];
  const mark=i=>items.forEach((n,j)=>n.classList.toggle("on",j===i));
  const at=()=>clampNum(Math.round(w.scrollTop/ROW),0,values.length-1);
  let idx=clampNum(index,0,values.length-1);mark(idx);
  w.init=()=>{w.scrollTop=idx*ROW};   /* call once the column is in the document */
  let raf=null,settle=null;
  w.addEventListener("scroll",()=>{
    if(raf)return;
    raf=requestAnimationFrame(()=>{
      raf=null;
      const i=at();
      if(i!==idx){idx=i;mark(idx);haptic(4)}
    });
    clearTimeout(settle);
    /* Read the position again here: the frame above is polish and may not run. */
    settle=setTimeout(()=>{const i=at();if(i!==idx){idx=i;mark(idx)}onChange&&onChange(idx)},130);
  },{passive:true});
  w.setTo=i=>{idx=clampNum(i,0,values.length-1);mark(idx);w.scrollTo({top:idx*ROW,behavior:"smooth"})};
  w.get=()=>idx;
  /* A tap on a row picks it; the scroll that follows commits it. */
  w.addEventListener("click",e=>{const i=items.indexOf(e.target);if(i>=0&&i!==idx)w.setTo(i)});
  return w;
}

/* --- Inline calendar (UIDatePicker .inline, from Habits). Always six weeks,
   and the wheels take the grid's height, so the sheet never changes size. --- */
function calendar({value,min,max,onPick}){
  const node=el("div","cal");
  const selKey=value;
  let view=fromKey(value);view.setDate(1);
  const minD=fromKey(min),maxD=fromKey(max);
  minD.setDate(1);

  const bar=el("div","cal-bar");
  const title=el("button","cal-title",
    `<span></span><span class="sr">, choose month and year</span><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 16.6 5.1 9.7a1.2 1.2 0 0 1 1.7-1.7L12 13.2l5.2-5.2a1.2 1.2 0 0 1 1.7 1.7z"/></svg>`);
  title.type="button";title.setAttribute("aria-expanded","false");
  const nav=el("div","cal-nav");
  const prev=el("button",null,'<svg width="11" height="18" viewBox="0 0 13 22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 1.5 2.5 11 11 20.5"/></svg>');
  const next=el("button",null,'<svg width="11" height="18" viewBox="0 0 13 22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 1.5 10.5 11 2 20.5"/></svg>');
  prev.type=next.type="button";
  prev.setAttribute("aria-label","Previous month");next.setAttribute("aria-label","Next month");
  nav.append(prev,next);bar.append(title,nav);

  const dow=el("div","cal-dow",DOW.map(d=>`<i>${esc(d)}</i>`).join(""));
  const grid=el("div","cal-grid");
  const wheels=el("div","cal-wheels wheels");
  node.append(bar,dow,grid,wheels);

  const y0=minD.getFullYear(),y1=maxD.getFullYear();
  const years=Array.from({length:y1-y0+1},(_,i)=>String(y0+i));
  let mW=null,yW=null;

  /* Months outside min..max stay on the wheel, faded, as on iOS. */
  const dimOut=()=>{
    if(!mW)return;
    const y=y0+yW.get(),lo=keyOf(minD),hi=keyOf(new Date(maxD.getFullYear(),maxD.getMonth(),1));
    [...mW.children].forEach((n,i)=>{const k=keyOf(new Date(y,i,1));n.classList.toggle("off",k<lo||k>hi)});
  };
  const atMin=()=>view.getFullYear()===minD.getFullYear()&&view.getMonth()===minD.getMonth();
  const atMax=()=>view.getFullYear()===maxD.getFullYear()&&view.getMonth()===maxD.getMonth();

  function draw(dir){
    title.firstChild.textContent=`${MONTHS[view.getMonth()]} ${view.getFullYear()}`;
    prev.disabled=atMin();next.disabled=atMax();
    const first=new Date(view.getFullYear(),view.getMonth(),1);
    const n=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
    let html="";
    for(let i=0;i<first.getDay();i++)html+='<b class="pad">0</b>';
    for(let d=1;d<=n;d++){
      const k=keyOf(new Date(view.getFullYear(),view.getMonth(),d));
      const out=k<min||k>max;
      const cls=[out?"dim":"",k===todayKey()?"now":"",k===selKey?"sel":""].filter(Boolean).join(" ");
      html+=`<button type="button" class="${cls}" aria-label="${esc(fmt(k,{weekday:"long",month:"long",day:"numeric",year:"numeric"}))}"`
        +(k===selKey?' aria-current="date"':"")
        +(out?" disabled":` data-k="${k}"`)+`>${d}${!out&&entries(k).length>0?"<em></em>":""}</button>`;
    }
    for(let i=first.getDay()+n;i<42;i++)html+='<b class="pad">0</b>';
    grid.className="cal-grid";
    void grid.offsetWidth;
    grid.innerHTML=html;
    if(dir)grid.classList.add(dir>0?"slide-l":"slide-r");
  }
  function hop(n){
    const v=new Date(view.getFullYear(),view.getMonth()+n,1);
    if(keyOf(v)<keyOf(minD))return;
    const cap=new Date(maxD.getFullYear(),maxD.getMonth(),1);
    if(keyOf(v)>keyOf(cap))return;
    view=v;draw(n);haptic(4);
    if(mW)mW.setTo(view.getMonth());
    if(yW)yW.setTo(view.getFullYear()-y0);
  }
  prev.onclick=()=>hop(-1);
  next.onclick=()=>hop(1);
  grid.addEventListener("click",e=>{
    const b=e.target.closest("button[data-k]");if(!b)return;
    haptic();
    grid.querySelectorAll(".sel").forEach(n=>{n.classList.remove("sel");n.removeAttribute("aria-current")});
    b.classList.add("sel");b.setAttribute("aria-current","date");
    onPick&&onPick(b.dataset.k);
  });

  title.onclick=()=>{
    /* Measured only while the grid is showing; it is display:none while picking. */
    if(!node.classList.contains("picking"))wheels.style.height=(grid.getBoundingClientRect().bottom-dow.getBoundingClientRect().top)+"px";
    const on=node.classList.toggle("picking");
    title.setAttribute("aria-expanded",String(on));
    if(on&&!mW){
      const commit=()=>{
        const y=y0+yW.get(),m=mW.get();
        const d=new Date(y,m,1);
        const lo=new Date(minD.getFullYear(),minD.getMonth(),1);
        const hi=new Date(maxD.getFullYear(),maxD.getMonth(),1);
        view=d<lo?lo:d>hi?hi:d;
        if(view.getFullYear()!==y||view.getMonth()!==m){
          mW.setTo(view.getMonth());yW.setTo(view.getFullYear()-y0);
        }
        draw(0);dimOut();
      };
      mW=wheel(MONTHS,view.getMonth(),commit);
      yW=wheel(years,view.getFullYear()-y0,commit);
      wheels.append(mW,yW);
      mW.init();yW.init();dimOut();
    }
    haptic();
  };

  draw(0);
  return node;
}
/* The diary reaches five years back, or further if there is older history. */
function earliestKey(){

/* Opens the calendar in a sheet. Resolves with a date key, or null. right:""

function pickDate({value,min=earliestKey(),max=todayKey(),title="Select date",right="Today"}){

/* --- Swipe to delete (from Habits). The row's tap still works; the click
   that ends a swipe is ignored. --- */
const SW=96;
let openRow=null;
function hideAct(row){setTimeout(()=>{if(openRow!==row)row.classList.remove("reveal")},340)}
function closeRow(){if(openRow){const r=openRow;r.querySelector(".sw-in").style.transform="";openRow=null;hideAct(r)}}
addEventListener("scroll",closeRow,{passive:true});
function swipeable(row){
  const inner=row.querySelector(".sw-in");
  row.addEventListener("pointerdown",e=>{
    if(e.target.closest(".sw-act"))return;
    const sx=e.clientX,sy=e.clientY,base=openRow===row?-SW:0;
    let axis=null;
    const move=ev=>{
      const dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(axis===null){
        if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){
          axis="x";if(openRow&&openRow!==row)closeRow();
          row.dataset.swiping="1";row.classList.add("reveal");
          inner.style.transition="none";
          try{row.setPointerCapture(ev.pointerId)}catch(err){}
        }else if(Math.abs(dy)>8){stop();return}
      }
      if(axis==="x"){ev.preventDefault();inner.style.transform=`translateX(${clampNum(base+dx,-SW-24,0)}px)`}
    };
    const up=ev=>{
      if(axis==="x"){
        const v=base+(ev.clientX-sx);
        inner.style.transition="";
        if(v<-SW/2){inner.style.transform=`translateX(${-SW}px)`;openRow=row;haptic()}
        else{inner.style.transform="";if(openRow===row)openRow=null;hideAct(row)}
        setTimeout(()=>{delete row.dataset.swiping},0);
      }
      stop();
    };
    const stop=()=>{
      row.removeEventListener("pointermove",move);
      removeEventListener("pointerup",up);removeEventListener("pointercancel",up);
    };
    row.addEventListener("pointermove",move);
    addEventListener("pointerup",up);addEventListener("pointercancel",up);
  });

/* A row with a Delete action behind it. onTap opens it; onDelete removes it. */

  box.appendChild(inner);
  row.append(act,box);
  act.onclick=()=>{closeRow();onDelete()};
  inner.addEventListener("click",()=>{
    if(row.dataset.swiping)return;
    /* A tap anywhere while a row is open only closes it. A row that a
       re-render has removed no longer counts as open. */
    if(openRow){const was=openRow;closeRow();if(was.isConnected)return}
    onTap&&onTap();
  });
  swipeable(row);
  return row;
}

/* ==========================================================================
   Food sources. Everything that can be logged becomes an "item":
     {ref, name, src, n (per 100 g), portions:[[label,grams]], q, u}
   ref says where it came from: u:<USDA id>, f:<food id>, r:<recipe id>.
   ========================================================================== */
let USDA=null,USDA_P=null;const USDA_BY_ID=new Map();
/* Plurals fold to one form on both sides, so "eggs" finds "Egg, whole" and
   "berries" finds "Strawberries". */
function stem(t){
  if(t.length>4&&t.endsWith("ies"))return t.slice(0,-3)+"y";
  if(t.length>4&&/(?:o|ch|sh|x|ss)es$/.test(t))return t.slice(0,-2);
  if(t.length>3&&t.endsWith("s")&&!t.endsWith("ss"))return t.slice(0,-1);
  return t;
}
const words=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
  .split(/[^a-z0-9%]+/).filter(Boolean).map(stem);
function loadUSDA(){
  if(USDA)return Promise.resolve(USDA);
  if(USDA_P)return USDA_P;
  USDA_P=fetch("foods.json").then(r=>{if(!r.ok)throw new Error("foods "+r.status);return r.json()}).then(j=>{
    if(!j||!Array.isArray(j.n)||j.n.join()!==N.join())throw new Error("foods.json nutrient order changed");
    USDA=j.foods.map(f=>{
      const h=headOf(f[1]);
      const o={id:f[0],name:f[1],src:f[2],n:f[3],p:f[4],w:h.w,h:h.h,a:h.a,b:formBonus(f[1])};
      USDA_BY_ID.set(o.id,o);return o;
    });
    return USDA;
  }).catch(e=>{USDA_P=null;throw e});
  return USDA_P;
}
const usdaItem=f=>({ref:"u:"+f.id,name:f.name,src:f.src==="f"?"USDA · as eaten":"USDA",n:f.n,portions:f.p||[]});
function foodItem(f){
  const showBrand=f.brand&&!f.name.toLowerCase().includes(f.brand.toLowerCase());
  return{ref:"f:"+f.id,name:f.name+(showBrand?` · ${f.brand}`:""),
    src:f.src==="off"?(f.mine?"Scanned by you":"Scanned by the group"):(f.mine?"Added by you":"Added by the group"),
    n:f.n,portions:f.portions||[],food:f};
}
/* A recipe is per 100 g of the finished dish: the ingredients' totals over the
   cooked weight, or over their raw weight if it was never weighed. */
function recipeInfo(r){
  const items=(r.items||[]).filter(Boolean);
  const raw=items.reduce((a,x)=>a+(x.g||0),0);
  const weight=r.cooked>0?r.cooked:raw;
  const n=new Array(N.length).fill(null);
  for(const x of items){
    if(!x.n)continue;
    for(let i=0;i<N.length;i++)if(x.n[i]!=null)n[i]=(n[i]||0)+x.n[i]*(x.g||0)/100;
  }
  const total=n[0]||0;
  const per100=n.map(v=>v==null||!(weight>0)?(v==null?null:0):Math.round(v/weight*100*10)/10);
  return{raw,weight,total,per100,serving:r.serv>0&&weight>0?weight/r.serv:null};
}
function recipeItem(r){
  const info=recipeInfo(r);
  const portions=[];
  if(info.serving)portions.push(["1 serving",Math.round(info.serving)]);
  if(info.weight>0)portions.push(["whole recipe",Math.round(info.weight)]);
  return{ref:"r:"+r.id,name:r.name,src:"Recipe",n:info.per100,portions,recipe:r};
}
function itemFromRef(ref){
  if(!ref)return null;
  const [t,id]=[ref.slice(0,1),ref.slice(2)];
  if(t==="u"){const f=USDA_BY_ID.get(+id);return f?usdaItem(f):null}
  if(t==="f"){const f=S.foods[id];return live(f)?foodItem(f):null}
  if(t==="r"){const r=S.meta.recipes[id];return live(r)?recipeItem(r):null}
  return null;
}
/* An item rebuilt from something already logged: the source if it still
   exists (its portions may be better), the logged snapshot if not. */
function itemFromEntry(e){
  const it=itemFromRef(e.ref)||{ref:e.ref,name:e.name,src:"Logged before",n:e.n,
    portions:e.u&&e.u!=="g"&&e.q>0?[[e.u,e.g/e.q]]:[]};
  return Object.assign({},it,{q:e.q,u:e.u||"g",name:e.name||it.name});
}
function unitGrams(item,u){
  if(!u||u==="g")return 1;
  const p=(item.portions||[]).find(x=>x[0]===u);
  return p?p[1]:null;
}
const per100Text=n=>`${kc(n&&n[0])} kcal · ${g1(n&&n[NI.protein])} g protein per 100 g`;

/* ---- recents: what this person actually eats, weighted to the meal ---- */
function recents(meal){
  const map=new Map();const t=fromKey(todayKey());
  for(let i=0;i<60;i++){
    const k=keyOf(addDays(t,-i));
    for(const e of entries(k)){
      if(e.u==="quick")continue;
      const key=e.ref||("n:"+e.name);
      let r=map.get(key);
      if(!r){r={e,count:0,inMeal:0};map.set(key,r)}
      r.count++;if(e.m===meal)r.inMeal++;
    }
  }
  return [...map.values()].sort((a,b)=>(b.inMeal-a.inMeal)||(b.count-a.count)||((b.e.t||0)-(a.e.t||0)));
}
const freqByRef=()=>{const m=new Map();for(const r of recents(""))m.set(r.e.ref,r.count);return m};

/* ---- search ----
   Every query word must start some word of the name. Earlier and exact hits
   score higher, long names lose a little, and things this person has added or
   eaten before come first. */
function scoreWords(w,qw,heads,alt=-1){
  let s=0;
  for(const t of qw){
    let at=-1;
    for(let i=0;i<w.length;i++)if(w[i].startsWith(t)){at=i;break}
    if(at<0)return -1;
    s+=at===0||at===alt?6:at<3?3:1;
    if(w[at]===t)s+=1.5;
  }
  /* "Egg, whole, raw" names the food in its first part; "Egg burrito" is a
     different food that happens to start with the word. Whole words count in
     full, a word still being typed a little. */
  let hb=0;
  for(const h of heads||[]){
    if(h.length!==qw.length)continue;
    if(qw.every(t=>h.includes(t)))hb=5;
    else if(qw.every(t=>h.some(x=>x.startsWith(t))))hb=Math.max(hb,2);
  }
  return s+hb-w.length/12;
}
/* USDA lists the everyday form of a food alongside dried, powdered and
   imitation ones. Nudge the everyday forms up. */
const COMMON=new Set(["raw","whole","cooked","boiled","plain","baked","roasted",
  "grilled","steamed","fresh","skinless","lean","boneless"].map(stem));
const RARE=new Set(["dried","powder","dehydrated","substitute","imitation","freeze","canned","frozen","sweetened",
  "unprepared","concentrate","flour","meal","mix","glazed","breaded"].map(stem));
function formBonus(name){
  let b=0;
  for(const w of words(name)){if(COMMON.has(w))b+=.8;else if(RARE.has(w))b-=1.6;else if(w==="nfs")b+=1.5}
  /* ~100 traditional foods (seal oil, caribou eye) that outrank everyday ones. */
  if(/Alaska Native/.test(name))b-=5;
  return clampNum(b,-6,1.6);
}
/* USDA files many foods under a category: "Fish, salmon, Atlantic, raw",
   "Beef, ground, 85% lean", "Bread, white". For these the second part names
   the food as much as the first does, so "salmon", "ground beef" and "white
   bread" all count as naming it. */
const CATEGORY=new Set(["fish","beef","pork","lamb","veal","cheese","oil","cereals","beverages","spices","nuts",
  "seeds","crustaceans","mollusks","beans","peppers","game meat","alcoholic beverage","lettuce","squash",
  "cabbage"].map(s=>words(s).join(" ")));
/* Here the second part only qualifies the first — "Cookies, peanut butter" is
   a cookie, not peanut butter — so it counts only together with the first. */
const QUALIFIED=new Set(["cookies","crackers","candies","snacks","soup","sauce","juice","yogurt","bread","milk",
  "rice","pasta","potato","potatoes","egg","eggs","apples","tomatoes","onions","sausage"].map(s=>words(s).join(" ")));
function headOf(name){
  const segs=name.split(",");const s1=words(segs[0]),k=s1.join(" ");
  if(segs.length>1&&CATEGORY.has(k)){
    const s2=words(segs[1]);
    return{w:words(name),h:[s1,s2,s1.concat(s2)],a:s1.length};
  }
  if(segs.length>1&&QUALIFIED.has(k))return{w:words(name),h:[s1,s1.concat(words(segs[1]))],a:-1};
  return{w:words(name),h:[s1],a:-1};
}
function searchItems(q,{mode,exclude}={}){
  const qw=words(q);if(!qw.length)return[];
  const out=[];const freq=freqByRef();
  const boost=ref=>Math.min(6,(freq.get(ref)||0)*1.5);
  const own=name=>[words(name)];
  for(const f of Object.values(S.foods)){
    if(!live(f))continue;
    const s=scoreWords(words(f.name+" "+(f.brand||"")),qw,own(f.name));
    if(s>=0)out.push({s:s+3+boost("f:"+f.id),item:foodItem(f)});
  }
  for(const r of Object.values(S.meta.recipes)){
    if(!live(r)||r.id===exclude)continue;
    const s=scoreWords(words(r.name),qw,own(r.name));
    if(s>=0)out.push({s:s+4+boost("r:"+r.id),item:recipeItem(r)});
  }
  if(mode==="log")for(const m of Object.values(S.meta.meals)){
    if(!live(m))continue;
    const s=scoreWords(words(m.name),qw,own(m.name));
    if(s>=0)out.push({s:s+4,meal:m});
  }
  if(USDA)for(const f of USDA){
    const s=scoreWords(f.w,qw,f.h,f.a);
    if(s>=0)out.push({s:s+f.b+boost("u:"+f.id),item:null,u:f});
  }
  out.sort((a,b)=>b.s-a.s);
  return out.slice(0,60).map(x=>x.u?{item:usdaItem(x.u)}:x);
}

/* ==========================================================================
   Barcodes: the phone's own detector where there is one (Chrome on Android),
   otherwise ZXing, vendored so it is cached with the app and works offline.
   ========================================================================== */
let zxingP=null;
function loadZXing(){
  if(window.ZXing)return Promise.resolve(window.ZXing);
  if(zxingP)return zxingP;
  zxingP=new Promise((res,rej)=>{
    const s=document.createElement("script");s.src="vendor/zxing-0.21.3.min.js";
    s.onload=()=>window.ZXing?res(window.ZXing):rej(new Error("zxing"));
    s.onerror=()=>{zxingP=null;rej(new Error("zxing"))};
    document.head.appendChild(s);
  });
  return zxingP;
}
async function makeDecoder(){
  if("BarcodeDetector" in window){
    try{
      const have=await BarcodeDetector.getSupportedFormats();
      const want=["ean_13","ean_8","upc_a","upc_e"].filter(f=>have.includes(f));
      if(want.length){
        const d=new BarcodeDetector({formats:want});
        return async v=>{const r=await d.detect(v);return r&&r[0]?r[0].rawValue:null};
      }
    }catch(e){}
  }
  const Z=await loadZXing();
  const hints=new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);
  hints.set(Z.DecodeHintType.TRY_HARDER,true);
  const reader=new Z.MultiFormatReader();reader.setHints(hints);
  const cv=document.createElement("canvas");
  const ctx=cv.getContext("2d",{willReadFrequently:true});
  return async v=>{
    const vw=v.videoWidth,vh=v.videoHeight;if(!vw||!vh)return null;
    /* The middle band, where the guide frame is, at up to 900 px wide. */
    const sh=Math.round(vh*.5),sy=Math.round((vh-sh)/2),sc=Math.min(1,900/vw);
    cv.width=Math.round(vw*sc);cv.height=Math.round(sh*sc);
    ctx.drawImage(v,0,sy,vw,sh,0,0,cv.width,cv.height);
    const px=ctx.getImageData(0,0,cv.width,cv.height).data;
    const lum=new Uint8ClampedArray(cv.width*cv.height);
    for(let i=0,j=0;j<lum.length;i+=4,j++)lum[j]=(px[i]*77+px[i+1]*150+px[i+2]*29)>>8;
    try{
      const bmp=new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.RGBLuminanceSource(lum,cv.width,cv.height)));
      return reader.decodeWithState(bmp).getText();
    }catch(e){return null}
    finally{try{reader.reset()}catch(e){}}
  };
}
function openScanner(onCode){
  let stream=null,stopped=false,timer=null,video,msgEl;
  const msg=t=>{if(msgEl)msgEl.textContent=t};
  const stop=()=>{stopped=true;clearTimeout(timer);if(stream)stream.getTracks().forEach(t=>t.stop())};
  const root=sheet({title:"Scan a barcode",left:"Cancel",build:body=>{
    body.innerHTML=`<div class="cam"><video playsinline muted autoplay></video><div class="guide"></div><div class="msg">Starting the camera…</div></div>
      <button class="btn ghost" type="button">Type the number instead</button>
      <p class="foot">Hold the barcode inside the frame. Works with the EAN and UPC codes on food packaging.</p>`;
    video=body.querySelector("video");msgEl=body.querySelector(".msg");
    body.querySelector(".btn").onclick=async()=>{
      stop();root.close();
      const v=await promptText({title:"Barcode",placeholder:"8 to 14 digits",numeric:true,
        check:x=>/^\d{8,14}$/.test(x.replace(/\s/g,""))||"That is not a barcode number"});
      if(v)onCode(v.replace(/\s/g,""));
    };
  }});
  root.onClosed=stop;
  (async()=>{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg("The camera is not available here. Type the number instead.");return}
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:false,
        video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}});
    }catch(e){
      msg(e&&e.name==="NotAllowedError"?"Camera access was refused. Allow it in Settings, or type the number.":"No camera found. Type the number instead.");
      return;
    }
    if(stopped){stop();return}
    video.srcObject=stream;
    try{await video.play()}catch(e){}
    let decode;
    try{decode=await makeDecoder()}catch(e){msg("The scanner did not load. Type the number instead.");return}
    msg("Point at a barcode");
    /* setTimeout, not rAF: a frame callback stalls in a background tab and
       nothing here is drawn anyway. */
    const tick=async()=>{
      if(stopped)return;
      let code=null;try{code=await decode(video)}catch(e){}
      if(stopped)return;
      if(code&&/^\d{8,14}$/.test(code)){haptic(25);stop();root.close();onCode(code);return}
      timer=setTimeout(tick,120);
    };
    tick();
  })();
}

/* ---- Open Food Facts ---- */
/* Two small requests rather than the whole product: asking for nutriments
   makes the API drop the quantity fields from the same reply (seen 2026-10),
   so the serving and pack sizes come in a second call. */
async function offLookup(code){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),9000);
  const base=`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=`;
  try{
    const [r,q]=await Promise.all([
      fetch(base+"code,product_name,product_name_en,generic_name,brands,nutriments",{signal:ctl.signal}),
      fetch(base+"serving_quantity,serving_size,product_quantity",{signal:ctl.signal}).catch(()=>null)]);
    if(r.status===404)return null;
    if(!r.ok)throw new Error("Open Food Facts "+r.status);
    const j=await r.json();
    if(!j||j.status!==1||!j.product)return null;
    try{if(q&&q.ok){const k=await q.json();if(k&&k.product)Object.assign(j.product,k.product)}}catch(e){}
    return j.product;
  }finally{clearTimeout(t)}
}
/* Open Food Facts stores per-100 g values in grams for everything except
   energy, so minerals and vitamins are scaled to the units used here. */
function offToFood(code,p){
  const nm=p.nutriments||{};
  const v=k=>{const x=nm[k];const y=typeof x==="string"?parseFloat(x):x;return typeof y==="number"&&isFinite(y)?y:null};
  const sc=(k,m)=>{const x=v(k);return x==null?null:x*m};
  let kcal=v("energy-kcal_100g");
  if(kcal==null){const kj=v("energy-kj_100g")!=null?v("energy-kj_100g"):v("energy_100g");if(kj!=null)kcal=kj/4.184}
  const name=(p.product_name||p.product_name_en||p.generic_name||"").trim();
  const brand=String(p.brands||"").split(",")[0].trim();
  if(kcal==null)return{partial:true,name,brand};
  const n=new Array(N.length).fill(null);
  n[0]=kcal;n[NI.protein]=v("proteins_100g");n[NI.fat]=v("fat_100g");n[NI.carbs]=v("carbohydrates_100g");
  n[NI.fiber]=v("fiber_100g");n[NI.sugar]=v("sugars_100g");n[NI.satfat]=v("saturated-fat_100g");
  let na=sc("sodium_100g",1000);if(na==null&&v("salt_100g")!=null)na=v("salt_100g")*400;
  n[NI.sodium]=na;
  n[NI.potassium]=sc("potassium_100g",1000);n[NI.calcium]=sc("calcium_100g",1000);
  n[NI.iron]=sc("iron_100g",1000);n[NI.magnesium]=sc("magnesium_100g",1000);n[NI.zinc]=sc("zinc_100g",1000);
  n[NI.vitA]=sc("vitamin-a_100g",1e6);n[NI.vitC]=sc("vitamin-c_100g",1000);n[NI.vitD]=sc("vitamin-d_100g",1e6);
  n[NI.vitE]=sc("vitamin-e_100g",1000);n[NI.vitK]=sc("vitamin-k_100g",1e6);n[NI.vitB12]=sc("vitamin-b12_100g",1e6);
  n[NI.folate]=sc("vitamin-b9_100g",1e6)!=null?sc("vitamin-b9_100g",1e6):sc("folates_100g",1e6);
  const portions=[];
  /* These two live on the product, not in its nutriments. */
  const top=k=>{const y=typeof p[k]==="string"?parseFloat(p[k]):p[k];return typeof y==="number"&&isFinite(y)?y:null};
  const sq=top("serving_quantity");
  if(sq>0)portions.push([p.serving_size?`1 serving (${String(p.serving_size).trim()})`:"1 serving",Math.round(sq*10)/10]);
  const pq=top("product_quantity");
  if(pq>0&&pq<=3000&&pq!==sq)portions.push(["1 pack",Math.round(pq)]);
  return{id:"b"+code,name:name||`Product ${code}`,brand,barcode:code,src:"off",
    n:n.map(x=>x==null?null:Math.round(x*10)/10),portions,mine:true,t:now()};
}
/* Scan → the group's own list → Open Food Facts → add it yourself. */
async function handleBarcode(code,onItem){
  const known=Object.values(S.foods).find(f=>live(f)&&f.barcode===code);
  if(known){onItem(foodItem(known));return}
  const looking=hud("Looking it up…",SEARCH_SVG.replace('width="16" height="16"','width="34" height="34"'),{hold:true});
  let p=null,failed=false;
  try{p=await offLookup(code)}catch(e){failed=true}finally{looking()}
  const food=p?offToFood(code,p):null;
  if(food&&!food.partial){S.foods[food.id]=food;dirtyFood(food.id);onItem(foodItem(food));return}
  const go=await alertBox({
    title:failed?"Could not look it up":"Not in the database",
    message:failed?"Open Food Facts did not answer. You can add the product yourself."
      :`Nothing has barcode ${code} yet. Add it once from the label and everyone in the group can scan it.`,
    actions:[{label:"Cancel",style:"cancel",value:false},{label:"Add it",value:true}]});
  if(go)openFoodEditor(null,{barcode:code,name:food&&food.name,brand:food&&food.brand,onSaved:f=>onItem(foodItem(f))});
}

/* A one-field sheet. check returns true, or a message to refuse with. */
function promptText({title,placeholder="",value="",numeric,check,right="Done",note}){
  return new Promise(res=>{

      onRight:()=>{

        done=true;res(v);

        inp=card.querySelector("input");inp.value=value;
